{{- $app := .Values }}
{{- $service := $app.service }}
{{- if and $service.enabled (not (include "vm.operator.enabled" .)) -}}
{{- $ctx := dict "helm" . "kindOverride" "vmagent" }}
{{- $fullname := include "vm.plain.fullname" $ctx }}
{{- $ns := include "vm.namespace" $ctx }}
---
apiVersion: v1
kind: Service
metadata:
  {{- with $service.annotations }}
  annotations: {{ toYaml . | nindent 4}}
  {{- end }}
  {{- $_ := set $ctx "extraLabels" $service.extraLabels }}
  labels: {{ include "vm.labels" $ctx | nindent 4 }}
  {{- $_ := unset $ctx "extraLabels" }}
  name: {{ $fullname }}
  namespace: {{ $ns }}
spec:
  {{- with $service.clusterIP }}
  clusterIP: {{ . }}
  {{- end }}
  {{- with $service.externalIPs }}
  externalIPs: {{ toYaml . | nindent 4 }}
  {{- end }}
  {{- with $service.loadBalancerIP }}
  loadBalancerIP: {{ . }}
  {{- end }}
  {{- with $service.loadBalancerSourceRanges }}
  loadBalancerSourceRanges: {{ toYaml . | nindent 4 }}
  {{- end }}
  type: {{ $service.type }}
  {{- with $service.healthCheckNodePort }}
  healthCheckNodePort: {{ . }}
  {{- end }}
  {{- with $service.externalTrafficPolicy }}
  externalTrafficPolicy: {{ . }}
  {{- end }}
  {{- with $service.internalTrafficPolicy }}
  internalTrafficPolicy: {{ . }}
  {{- end }}
  {{- with $service.ipFamilyPolicy }}
  ipFamilyPolicy: {{ . }}
  {{- end }}
  {{- with $service.ipFamilies }}
  ipFamilies: {{ toYaml . | nindent 4 }}
  {{- end }}
  {{- with $service.trafficDistribution }}
  trafficDistribution: {{ . }}
  {{- end }}
  ports:
    {{- $overrides := $service.portOverrides | default dict }}
    {{- $httpAddr := (.Values.extraArgs | default dict).httpListenAddr -}}
    {{- range ternary .Values.http (list (dict "name" "http" "value" $httpAddr "primary" true)) (empty $httpAddr) }}
    {{- $override := dig .name dict $overrides }}
    - name: {{ .name }}
      {{- $port := include "vm.port.from.flag" (dict "flag" .value "default" "8429") }}
      {{- $defaultPort := ternary ($service.servicePort | default $port) $port (and (.primary | default false) (not (empty $service.servicePort))) }}
      port: {{ $override.port | default $defaultPort }}
      protocol: {{ $override.protocol | default "TCP" }}
      {{- $defaultTargetPort := ternary $service.targetPort .name (and (.primary | default false) (not (empty $service.targetPort))) }}
      targetPort: {{ $override.targetPort | default $defaultTargetPort }}
      {{- $defaultNodePort := "" }}
      {{- if and .primary $service.nodePort }}
      {{- $defaultNodePort = $service.nodePort }}
      {{- end }}
      {{- with ($override.nodePort | default $defaultNodePort) }}
      nodePort: {{ . }}
      {{- end }}
      {{- with $override.appProtocol }}
      appProtocol: {{ . }}
      {{- end }}
    {{- end }}
    {{- with .Values.extraArgs.graphiteListenAddr }}
    {{- $override := dig "graphite-tcp" dict $overrides }}
    - name: graphite-tcp
      protocol: {{ $override.protocol | default "TCP" }}
      port: {{ $override.port | default (include "vm.port.from.flag" (dict "flag" .)) }}
      targetPort: {{ $override.targetPort | default "graphite-tcp" }}
      {{- with $override.nodePort }}
      nodePort: {{ . }}
      {{- end }}
      {{- with $override.appProtocol }}
      appProtocol: {{ . }}
      {{- end }}
    {{- $override := dig "graphite-udp" dict $overrides }}
    - name: graphite-udp
      protocol: {{ $override.protocol | default "UDP" }}
      port: {{ $override.port | default (include "vm.port.from.flag" (dict "flag" .)) }}
      targetPort: {{ $override.targetPort | default "graphite-udp" }}
      {{- with $override.nodePort }}
      nodePort: {{ . }}
      {{- end }}
      {{- with $override.appProtocol }}
      appProtocol: {{ . }}
      {{- end }}
    {{- end }}
    {{- with .Values.extraArgs.influxListenAddr }}
    {{- $override := dig "influx-tcp" dict $overrides }}
    - name: influx-tcp
      protocol: {{ $override.protocol | default "TCP" }}
      port: {{ $override.port | default (include "vm.port.from.flag" (dict "flag" .)) }}
      targetPort: {{ $override.targetPort | default "influx-tcp" }}
      {{- with $override.nodePort }}
      nodePort: {{ . }}
      {{- end }}
      {{- with $override.appProtocol }}
      appProtocol: {{ . }}
      {{- end }}
    {{- $override := dig "influx-udp" dict $overrides }}
    - name: influx-udp
      protocol: {{ $override.protocol | default "UDP" }}
      port: {{ $override.port | default (include "vm.port.from.flag" (dict "flag" .)) }}
      targetPort: {{ $override.targetPort | default "influx-udp" }}
      {{- with $override.nodePort }}
      nodePort: {{ . }}
      {{- end }}
      {{- with $override.appProtocol }}
      appProtocol: {{ . }}
      {{- end }}
    {{- end }}
    {{- with .Values.extraArgs.opentsdbHTTPListenAddr }}
    {{- $override := dig "opentsdbhttp" dict $overrides }}
    - name: opentsdbhttp
      port: {{ $override.port | default (include "vm.port.from.flag" (dict "flag" .)) }}
      {{- with $override.protocol }}
      protocol: {{ . }}
      {{- end }}
      targetPort: {{ $override.targetPort | default "opentsdbhttp" }}
      {{- with $override.nodePort }}
      nodePort: {{ . }}
      {{- end }}
      {{- with $override.appProtocol }}
      appProtocol: {{ . }}
      {{- end }}
    {{- end }}
    {{- with .Values.extraArgs.opentsdbListenAddr }}
    {{- $override := dig "opentsdb-udp" dict $overrides }}
    - name: opentsdb-udp
      protocol: {{ $override.protocol | default "UDP" }}
      port: {{ $override.port | default (include "vm.port.from.flag" (dict "flag" .)) }}
      targetPort: {{ $override.targetPort | default "opentsdb-udp" }}
      {{- with $override.nodePort }}
      nodePort: {{ . }}
      {{- end }}
      {{- with $override.appProtocol }}
      appProtocol: {{ . }}
      {{- end }}
    {{- $override := dig "opentsdb-tcp" dict $overrides }}
    - name: opentsdb-tcp
      protocol: {{ $override.protocol | default "TCP" }}
      port: {{ $override.port | default (include "vm.port.from.flag" (dict "flag" .)) }}
      targetPort: {{ $override.targetPort | default "opentsdb-tcp" }}
      {{- with $override.nodePort }}
      nodePort: {{ . }}
      {{- end }}
      {{- with $override.appProtocol }}
      appProtocol: {{ . }}
      {{- end }}
    {{- end }}
  {{- $_ := set $ctx "extraLabels" (mergeOverwrite (deepCopy .Values.selectorLabels) (deepCopy $service.selectorLabels)) }}
  selector: {{ include "vm.selectorLabels" $ctx | nindent 4 }}
  {{- $_ := unset $ctx "extraLabels" }}
{{- end }}
