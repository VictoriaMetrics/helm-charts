suite: server templates test
chart:
  version: 0.1.1
  appVersion: 0.1.0
templates:
  - server.yaml
  - configmap.yaml
tests:
  - it: deployment should match snapshot
    asserts:
      - matchSnapshot: {}
    set:
      remoteWrite:
        - url: http://vm-insert:8480/insert/0/prometheus
  - it: deployment with volume should match snapshot
    asserts:
      - matchSnapshot: {}
    set:
      persistentVolume:
        enabled: true
      remoteWrite:
        - url: http://vm-insert:8480/insert/0/prometheus
  - it: statefulset should match snapshot
    set:
      statefulSet:
        enabled: true
      mode: statefulSet
      remoteWrite:
        - url: http://vm-insert:8480/insert/0/prometheus
    asserts:
      - matchSnapshot: {}
  - it: statefulset with volume should match snapshot
    set:
      statefulSet:
        enabled: true
      persistentVolume:
        enabled: true
      mode: statefulSet
      remoteWrite:
        - url: http://vm-insert:8480/insert/0/prometheus
    asserts:
      - matchSnapshot: {}
  - it: should render custom command
    set:
      remoteWrite:
        - url: http://vm-insert:8480/insert/0/prometheus
      command:
        - /custom/bin/vmagent
    asserts:
      - equal:
          path: spec.template.spec.containers[0].command
          value:
            - /custom/bin/vmagent
        template: server.yaml
        documentIndex: 0
  - it: should apply global.extraLabels to resource metadata and pod template
    set:
      remoteWrite:
        - url: http://vm-insert:8480/insert/0/prometheus
      global:
        extraLabels:
          team: platform
    asserts:
      - equal:
          path: metadata.labels.team
          value: platform
        template: server.yaml
        documentIndex: 0
      - equal:
          path: spec.template.metadata.labels.team
          value: platform
        template: server.yaml
        documentIndex: 0
  - it: should render custom dnsConfig
    set:
      remoteWrite:
        - url: http://vm-insert:8480/insert/0/prometheus
      dnsConfig:
        nameservers:
          - 1.1.1.1
        options:
          - name: ndots
            value: "2"
    asserts:
      - equal:
          path: spec.template.spec.dnsConfig
          value:
            nameservers:
              - 1.1.1.1
            options:
              - name: ndots
                value: "2"
        template: server.yaml
        documentIndex: 0

  - it: should set GOMEMLIMIT to 85 percent of the memory limit
    set:
      remoteWrite:
        - url: http://vm-insert:8480/insert/0/prometheus
      resources:
        limits:
          memory: 5Gi
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GOMEMLIMIT
            value: 4352MiB
        template: server.yaml

  - it: should convert decimal and exponent memory quantities
    set:
      remoteWrite:
        - url: http://vm-insert:8480/insert/0/prometheus
      resources:
        limits:
          memory: 1.5G
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GOMEMLIMIT
            value: 1215MiB
        template: server.yaml

  - it: should convert exponent memory quantities
    set:
      remoteWrite:
        - url: http://vm-insert:8480/insert/0/prometheus
      resources:
        limits:
          memory: 129e6
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GOMEMLIMIT
            value: 104MiB
        template: server.yaml

  - it: should calculate a decimal quantity exactly at a MiB boundary
    set:
      remoteWrite:
        - url: http://vm-insert:8480/insert/0/prometheus
      resources:
        limits:
          memory: 5103197671.757G
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GOMEMLIMIT
            value: 4136770268434MiB
        template: server.yaml

  - it: should scale large mantissas before the int64 range check
    set:
      remoteWrite:
        - url: http://vm-insert:8480/insert/0/prometheus
      resources:
        limits:
          memory: "10000000000000000000m"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GOMEMLIMIT
            value: 8106231689MiB
        template: server.yaml

  - it: should preserve an explicit GOMEMLIMIT
    set:
      remoteWrite:
        - url: http://vm-insert:8480/insert/0/prometheus
      resources:
        limits:
          memory: 5Gi
      env:
        - name: GOMEMLIMIT
          value: 123MiB
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GOMEMLIMIT
            value: 123MiB
        template: server.yaml
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: GOMEMLIMIT
            value: 4352MiB
        template: server.yaml

  - it: should not set GOMEMLIMIT when no memory limit is configured
    set:
      remoteWrite:
        - url: http://vm-insert:8480/insert/0/prometheus
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env
          value:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
        template: server.yaml

  - it: should not set GOMEMLIMIT when disabled
    set:
      remoteWrite:
        - url: http://vm-insert:8480/insert/0/prometheus
      useGOMEMLIMIT: false
      resources:
        limits:
          memory: 5Gi
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env
          value:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
        template: server.yaml

  - it: should not override values that may be supplied through envFrom
    set:
      remoteWrite:
        - url: http://vm-insert:8480/insert/0/prometheus
      resources:
        limits:
          memory: 5Gi
      envFrom:
        - configMapRef:
            name: app-env
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env
          value:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
        template: server.yaml

  - it: should fail when the memory quantity is invalid
    set:
      remoteWrite:
        - url: http://vm-insert:8480/insert/0/prometheus
      resources:
        limits:
          memory: 1foo
    asserts:
      - failedTemplate:
          errorMessage: 'invalid memory quantity "1foo" for automatic GOMEMLIMIT'
        template: server.yaml

  - it: should fail when GOMEMLIMIT would be less than 1MiB
    set:
      remoteWrite:
        - url: http://vm-insert:8480/insert/0/prometheus
      resources:
        limits:
          memory: 1Mi
    asserts:
      - failedTemplate:
          errorMessage: '85% of memory quantity "1Mi" is less than 1MiB; automatic GOMEMLIMIT must be at least 1MiB'
        template: server.yaml

  - it: should apply global.extraAnnotations to resource metadata and pod template
    set:
      remoteWrite:
        - url: http://vm-insert:8480/insert/0/prometheus
      global:
        extraAnnotations:
          owner: platform-team
    asserts:
      - equal:
          path: metadata.annotations.owner
          value: platform-team
        template: server.yaml
        documentIndex: 0
      - equal:
          path: spec.template.metadata.annotations.owner
          value: platform-team
        template: server.yaml
        documentIndex: 0
