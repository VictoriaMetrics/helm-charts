suite: volume naming tests
set:
  remoteWrite[0].url: http://x
  mode: statefulSet
  persistentVolume.enabled: true
templates:
  - server.yaml
  - configmap.yaml
tests:
  - it: uses the legacy volume name by default
    asserts:
      - template: server.yaml
        equal:
          path: spec.volumeClaimTemplates[0].metadata.name
          value: tmpdata
      - template: server.yaml
        exists:
          path: spec.template.spec.containers[0].volumeMounts[?(@.name == "tmpdata")]

  - it: "uses the operator volume name with useLegacyNaming: false"
    set:
      useLegacyNaming: false
    asserts:
      - template: server.yaml
        equal:
          path: spec.volumeClaimTemplates[0].metadata.name
          value: persistent-queue-data
      - template: server.yaml
        exists:
          path: spec.template.spec.containers[0].volumeMounts[?(@.name == "persistent-queue-data")]

  - it: an explicit volume name is used for both the claim template and the mount
    set:
      persistentVolume.name: custom-volume
      useLegacyNaming: false
    asserts:
      - template: server.yaml
        equal:
          path: spec.volumeClaimTemplates[0].metadata.name
          value: custom-volume
      - template: server.yaml
        exists:
          path: spec.template.spec.containers[0].volumeMounts[?(@.name == "custom-volume")]
