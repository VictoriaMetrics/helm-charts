{{- if or (and .Values.grafana.enabled .Values.grafana.sidecar.datasources.enabled ) .Values.grafana.forceDeployDatasource }}
{{- $ctx := dict "helm" . }}
{{- $grafanaOperator := .Values.defaultDatasources.grafanaOperator }}
{{- $fullname := include "vm.fullname" $ctx }}
{{- $output := include "vm.data.sources" . | fromYaml }}
{{- if $grafanaOperator.enabled }}
{{- range $ds := $output.datasources }}
---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDatasource
metadata:
  namespace: {{ include "vm.namespace" $ }}
  name: {{ $fullname }}-{{ regexReplaceAll "[-]+" (regexReplaceAll "[^\\w]" (lower $ds.name) "-") "-" | trimSuffix "-" }}
  labels: {{ include "vm.labels" $ctx | nindent 4 }}
  {{- $dsAnnotations := mergeOverwrite (deepCopy ($.Values.global.extraAnnotations | default dict)) (deepCopy ($grafanaOperator.annotations | default dict)) }}
  {{- with $dsAnnotations }}
  annotations:
    {{- range $key, $val := . }}
    {{ $key }}: {{ $val | quote }}
    {{- end }}
  {{- end }}
  {{- $spec := deepCopy $grafanaOperator.spec }}
  {{- $_ := set $spec "datasource" $ds }}
  {{- $_ := set $ctx "ds" $ds }}
  {{- if eq (include "vm.data.source.enabled" $ctx) "false" -}}
    {{- $plugin := dict "name" $ds.type "version" ($ds.version | default "latest") }}
    {{- $_ := set $spec "plugins" (list $plugin) }}
  {{- end }}
  {{- $_ := unset $ds "plugin" }}
  {{- $_ := unset $ds "version" }}
spec: {{ toYaml $spec | nindent 2 }}
{{- end }}
{{- else }}
  {{- $datasources := list }}
  {{- range $ds := $output.datasources }}
    {{- $_ := set $ctx "ds" $ds }}
    {{- if eq (include "vm.data.source.enabled" $ctx) "true" -}}
      {{- $_ := unset $ds "plugin" }}
      {{- $_ := unset $ds "version" }}
      {{- $datasources = append $datasources $ds }}
    {{- end -}}
  {{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $fullname }}-grafana-ds
  namespace: {{ include "vm.namespace" $ }}
  {{- $_ := set $ctx "extraAnnotations" $.Values.grafana.sidecar.datasources.annotations }}
  {{- with (include "vm.annotations" $ctx) }}
  annotations: {{ . | nindent 4 }}
  {{- end }}
  {{- $_ := unset $ctx "extraAnnotations" }}
  labels:
    {{ $.Values.grafana.sidecar.datasources.label }}: {{ $.Values.grafana.sidecar.datasources.labelValue | quote }}
    app.kubernetes.io/component: grafana
    {{- include "vm.labels" $ctx | nindent 4 }}
data:
  datasource.yaml: |-
    apiVersion: 1
    datasources: {{ toYaml $datasources | nindent 6 }}
{{- end }}
{{- end }}
