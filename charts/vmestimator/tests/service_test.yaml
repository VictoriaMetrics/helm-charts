suite: Service
templates:
  - service.yaml
tests:
  - it: keeps metadata-only labels out of the pod selector
    set:
      single.service.labels.owner: networking
    asserts:
      - equal:
          path: metadata.labels.owner
          value: networking
      - equal:
          path: spec.selector
          value:
            app: single
            app.kubernetes.io/instance: RELEASE-NAME
            app.kubernetes.io/name: vmestimator
  - it: derives the Service port from the listener
    set:
      single.extraArgs.httpListenAddr: "127.0.0.1:9000"
    asserts:
      - equal:
          path: spec.ports[0].port
          value: 9000
  - it: preserves the insert suffix for long names
    set:
      mode: cluster
      useLegacyNaming: true
      fullnameOverride: abcdefghijklmnopqrstuvwxyzabcdefghijklmnopqrstuvwxyzabcdefghijk
    asserts:
      - equal:
          path: metadata.name
          value: abcdefghijklmnopqrstuvwxyzabcdefghijklmnopqrstuvwxyzabcd-insert
        documentIndex: 1
