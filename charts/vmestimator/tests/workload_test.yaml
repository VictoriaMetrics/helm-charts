suite: vmestimator workloads
templates:
  - workload.yaml
tests:
  - it: renders single mode
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Deployment
      - contains:
          path: spec.template.spec.containers[0].args
          content: --config=/etc/vmestimator/streams.yaml
      - matchRegex:
          path: spec.template.metadata.annotations["checksum/config"]
          pattern: ^[a-f0-9]{64}$
  - it: omits the checksum for an external ConfigMap
    set:
      config.existingConfigMap: external-config
    asserts:
      - notExists:
          path: spec.template.metadata.annotations["checksum/config"]
      - equal:
          path: spec.template.spec.volumes[0].configMap.name
          value: external-config
  - it: derives the container port from the listener
    set:
      single.extraArgs.httpListenAddr: ":9000"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --httpListenAddr=:9000
      - equal:
          path: spec.template.spec.containers[0].ports[0].containerPort
          value: 9000
  - it: renders cluster mode
    set:
      mode: cluster
      storage.replicaCount: 2
      storage.extraArgs.httpListenAddr: ":9001"
    asserts:
      - hasDocuments:
          count: 2
      - isKind:
          of: StatefulSet
        documentIndex: 0
      - isKind:
          of: Deployment
        documentIndex: 1
      - contains:
          path: spec.template.spec.containers[0].args
          content: --storageNode=http://RELEASE-NAME-vmestimator-storage-1.RELEASE-NAME-vmestimator-storage.NAMESPACE.svc.cluster.local:9001
        documentIndex: 1
