suite: useLegacyNaming tests
templates:
  - ingress.yaml
  - service.yaml
  - route.yaml
set:
  license.key: dummy
  config.reader.datasource_url: http://x
  config.writer.datasource_url: http://x
  config.reader.queries.q.expr: up
  ingress.enabled: true
  service.enabled: true
  route.enabled: true
tests:
  - it: resource names (legacy naming, default)
    asserts:
      - equal:
          path: metadata.name
          value: RELEASE-NAME-victoria-metrics-anomaly
        template: ingress.yaml
      - equal:
          path: metadata.name
          value: RELEASE-NAME-victoria-metrics-anomaly
        template: service.yaml
      - equal:
          path: metadata.name
          value: RELEASE-NAME-victoria-metrics-anomaly
        template: route.yaml
  - it: "resource names (useLegacyNaming: false)"
    set:
      useLegacyNaming: false
    asserts:
      - equal:
          path: metadata.name
          value: vmanomaly-RELEASE-NAME
        template: ingress.yaml
      - equal:
          path: metadata.name
          value: vmanomaly-RELEASE-NAME
        template: service.yaml
      - equal:
          path: metadata.name
          value: vmanomaly-RELEASE-NAME
        template: route.yaml
