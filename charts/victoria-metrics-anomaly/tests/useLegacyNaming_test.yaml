suite: useLegacyNaming tests
templates:
  - configmap.yaml
  - ingress.yaml
  - monitor.yaml
  - networkpolicy.yaml
  - pdb.yaml
  - route.yaml
  - server.yaml
  - service.yaml
set:
  license.key: dummy
  config.reader.datasource_url: http://x
  config.writer.datasource_url: http://x
  config.reader.queries.q.expr: up
  config.monitoring.pull.enabled: true
  config.monitoring.pull.port: 8490
  ingress.enabled: true
  service.enabled: true
  route.enabled: true
  podMonitor.enabled: true
  networkPolicy.enabled: true
  podDisruptionBudget.enabled: true
  podDisruptionBudget.minAvailable: 1
  persistentVolume.enabled: true
tests:
  - it: resource names (legacy naming, default)
    asserts:
      - equal:
          path: metadata.name
          value: RELEASE-NAME-victoria-metrics-anomaly
        template: configmap.yaml
      - equal:
          path: metadata.name
          value: RELEASE-NAME-victoria-metrics-anomaly
        template: ingress.yaml
      - equal:
          path: metadata.name
          value: RELEASE-NAME-victoria-metrics-anomaly
        template: monitor.yaml
      - equal:
          path: metadata.name
          value: RELEASE-NAME-victoria-metrics-anomaly
        template: networkpolicy.yaml
      - equal:
          path: metadata.name
          value: RELEASE-NAME-victoria-metrics-anomaly
        template: pdb.yaml
      - equal:
          path: metadata.name
          value: RELEASE-NAME-victoria-metrics-anomaly
        template: route.yaml
      - equal:
          path: metadata.name
          value: RELEASE-NAME-victoria-metrics-anomaly
        template: server.yaml
      - equal:
          path: metadata.name
          value: RELEASE-NAME-victoria-metrics-anomaly
        template: service.yaml
      - equal:
          path: spec.template.spec.containers[0].name
          value: vmanomaly
        template: server.yaml
      - equal:
          path: spec.volumeClaimTemplates[0].metadata.name
          value: models-dump
        template: server.yaml
      - exists:
          path: spec.template.spec.containers[0].volumeMounts[?(@.name == "models-dump")]
        template: server.yaml
      - exists:
          path: spec.template.spec.volumes[?(@.configMap.name == "RELEASE-NAME-victoria-metrics-anomaly")]
        template: server.yaml
  - it: "resource names (useLegacyNaming: false)"
    set:
      useLegacyNaming: false
    asserts:
      - equal:
          path: metadata.name
          value: vmanomaly-RELEASE-NAME
        template: configmap.yaml
      - equal:
          path: metadata.name
          value: vmanomaly-RELEASE-NAME
        template: ingress.yaml
      - equal:
          path: metadata.name
          value: vmanomaly-RELEASE-NAME
        template: monitor.yaml
      - equal:
          path: metadata.name
          value: vmanomaly-RELEASE-NAME
        template: networkpolicy.yaml
      - equal:
          path: metadata.name
          value: vmanomaly-RELEASE-NAME
        template: pdb.yaml
      - equal:
          path: metadata.name
          value: vmanomaly-RELEASE-NAME
        template: route.yaml
      - equal:
          path: metadata.name
          value: vmanomaly-RELEASE-NAME
        template: server.yaml
      - equal:
          path: metadata.name
          value: vmanomaly-RELEASE-NAME
        template: service.yaml
      - equal:
          path: spec.template.spec.containers[0].name
          value: vmanomaly
        template: server.yaml
      - equal:
          path: spec.volumeClaimTemplates[0].metadata.name
          value: vmanomaly-storage
        template: server.yaml
      - exists:
          path: spec.template.spec.containers[0].volumeMounts[?(@.name == "vmanomaly-storage")]
        template: server.yaml
      - exists:
          path: spec.template.spec.volumes[?(@.configMap.name == "vmanomaly-RELEASE-NAME")]
        template: server.yaml
