suite: extra containers and hostPath mounts
set:
  license.key: dummy
  config.reader.datasource_url: http://x
  config.writer.datasource_url: http://x
  config.reader.queries.q.expr: up
templates:
  - server.yaml
tests:
  - it: renders only the vmanomaly container by default
    asserts:
      - lengthEqual:
          path: spec.template.spec.containers
          count: 1

  - it: appends extraContainers to the pod
    set:
      extraContainers:
        - name: sidecar
          image: busybox
    asserts:
      - lengthEqual:
          path: spec.template.spec.containers
          count: 2
      - equal:
          path: spec.template.spec.containers[1]
          value:
            name: sidecar
            image: busybox

  - it: mounts extraHostPathMounts into the container
    set:
      extraHostPathMounts:
        - name: certs-dir
          mountPath: /etc/kubernetes/certs
          subPath: ca
          hostPath: /etc/kubernetes/certs
          readOnly: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: certs-dir
            mountPath: /etc/kubernetes/certs
            subPath: ca
            readOnly: true
      - contains:
          path: spec.template.spec.volumes
          content:
            name: certs-dir
            hostPath:
              path: /etc/kubernetes/certs
