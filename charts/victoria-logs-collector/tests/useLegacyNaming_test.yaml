suite: useLegacyNaming tests
set:
  remoteWrite[0].url: http://x
  podMonitor.enabled: true
  networkPolicy.enabled: true
templates:
  - monitor.yaml
  - networkpolicy.yaml
  - rbac.yaml
  - server.yaml
  - serviceaccount.yaml
tests:
  - it: "resource names (legacy naming, default)"
    asserts:
      - equal:
          path: metadata.name
          value: RELEASE-NAME-victoria-logs-collector
        template: monitor.yaml
      - equal:
          path: metadata.name
          value: RELEASE-NAME-victoria-logs-collector
        template: networkpolicy.yaml
      - equal:
          path: metadata.name
          value: RELEASE-NAME-victoria-logs-collector
        template: server.yaml
      - equal:
          path: metadata.name
          value: RELEASE-NAME-victoria-logs-collector
        template: serviceaccount.yaml
      - equal:
          path: metadata.name
          value: RELEASE-NAME-victoria-logs-collector
        template: rbac.yaml
        documentSelector:
          path: kind
          value: ClusterRole
      - equal:
          path: metadata.name
          value: RELEASE-NAME-victoria-logs-collector
        template: rbac.yaml
        documentSelector:
          path: kind
          value: ClusterRoleBinding
      - equal:
          path: roleRef.name
          value: RELEASE-NAME-victoria-logs-collector
        template: rbac.yaml
        documentSelector:
          path: kind
          value: ClusterRoleBinding
      - equal:
          path: subjects[0].name
          value: RELEASE-NAME-victoria-logs-collector
        template: rbac.yaml
        documentSelector:
          path: kind
          value: ClusterRoleBinding
      - equal:
          path: spec.template.spec.serviceAccountName
          value: RELEASE-NAME-victoria-logs-collector
        template: server.yaml
  - it: "resource names, useLegacyNaming=false"
    set:
      useLegacyNaming: false
    asserts:
      - equal:
          path: metadata.name
          value: vlagent-collector-RELEASE-NAME
        template: monitor.yaml
      - equal:
          path: metadata.name
          value: vlagent-collector-RELEASE-NAME
        template: networkpolicy.yaml
      - equal:
          path: metadata.name
          value: vlagent-collector-RELEASE-NAME
        template: server.yaml
      - equal:
          path: metadata.name
          value: vlagent-collector-RELEASE-NAME
        template: serviceaccount.yaml
      - equal:
          path: metadata.name
          value: vlagent-collector-RELEASE-NAME
        template: rbac.yaml
        documentSelector:
          path: kind
          value: ClusterRole
      - equal:
          path: metadata.name
          value: vlagent-collector-RELEASE-NAME
        template: rbac.yaml
        documentSelector:
          path: kind
          value: ClusterRoleBinding
      - equal:
          path: roleRef.name
          value: vlagent-collector-RELEASE-NAME
        template: rbac.yaml
        documentSelector:
          path: kind
          value: ClusterRoleBinding
      - equal:
          path: subjects[0].name
          value: vlagent-collector-RELEASE-NAME
        template: rbac.yaml
        documentSelector:
          path: kind
          value: ClusterRoleBinding
      - equal:
          path: spec.template.spec.serviceAccountName
          value: vlagent-collector-RELEASE-NAME
        template: server.yaml
