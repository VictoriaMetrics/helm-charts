suite: operator mode
templates:
  - networkpolicy.yaml
  - vlagent.yaml
  - server.yaml
  - serviceaccount.yaml
  - rbac.yaml
  - monitor.yaml
set:
  operator.enabled: true
  remoteWrite:
    - url: http://vl:9428
tests:
  - it: doesn't render a VLAgent by default
    set:
      operator.enabled: false
    asserts:
      - hasDocuments:
          count: 0
        template: vlagent.yaml

  - it: renders a collector VLAgent named like the chart workload
    asserts:
      - isKind:
          of: VLAgent
        template: vlagent.yaml
      - equal:
          path: metadata.name
          value: collector-RELEASE-NAME
        template: vlagent.yaml
      - equal:
          path: spec.k8sCollector.enabled
          value: true
        template: vlagent.yaml
      - hasDocuments:
          count: 0
        template: server.yaml
      - hasDocuments:
          count: 0
        template: serviceaccount.yaml
      - hasDocuments:
          count: 0
        template: rbac.yaml

  - it: converts collector settings
    set:
      collector:
        timeField: [ts]
        msgField: [msg]
        streamFields: [kubernetes.pod_name]
        excludeFilter: 'kubernetes.pod_namespace:="kube-system"'
        includeNodeLabels: true
    asserts:
      - isSubset:
          path: spec.k8sCollector
          content:
            enabled: true
            timeFields: [ts]
            msgFields: [msg]
            streamFields: [kubernetes.pod_name]
            excludeFilter: 'kubernetes.pod_namespace:="kube-system"'
            includeNodeLabels: true
        template: vlagent.yaml

  - it: keeps the chart's host path for queue and checkpoints
    asserts:
      - equal:
          path: spec.tmpDataPath
          value: /var/lib/vl-collector
        template: vlagent.yaml
      - equal:
          path: spec.volumes
          value:
            - name: tmp-data
              hostPath:
                path: /var/lib/vl-collector
        template: vlagent.yaml
      - notExists:
          path: spec.extraArgs.tmpDataPath
        template: vlagent.yaml

  - it: appends the native insert path like the chart does
    asserts:
      - equal:
          path: spec.remoteWrite[0].url
          value: http://vl:9428/insert/native
        template: vlagent.yaml

  - it: lets the operator create the pod scrape object instead of the chart
    set:
      podMonitor.enabled: true
    asserts:
      - notExists:
          path: spec.disableSelfServiceScrape
        template: vlagent.yaml
      - hasDocuments:
          count: 0
        template: monitor.yaml

  - it: rejects file collection
    set:
      fileCollector:
        - glob: /var/log/*.log
    asserts:
      - failedTemplate:
          errorPattern: "`fileCollector` is not converted"
        template: vlagent.yaml

  - it: converts the NetworkPolicy and lets the operator create it
    set:
      networkPolicy:
        enabled: true
        ingress:
          - from:
              - podSelector: {}
    asserts:
      - equal:
          path: spec.networkPolicy
          value:
            ingress:
              - from:
                  - podSelector: {}
        template: vlagent.yaml
      - hasDocuments:
          count: 0
        template: networkpolicy.yaml

  - it: rejects NetworkPolicy metadata the operator can't set
    set:
      networkPolicy:
        enabled: true
        labels:
          team: obs
    asserts:
      - failedTemplate:
          errorPattern: "`networkPolicy.labels` is not converted"
        template: vlagent.yaml

