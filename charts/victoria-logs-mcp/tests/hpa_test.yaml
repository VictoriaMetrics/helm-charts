suite: HorizontalPodAutoscaler
templates:
  - hpa.yaml
tests:
  - it: is not rendered by default
    asserts:
      - hasDocuments:
          count: 0

  - it: targets the deployment by its rendered name
    release:
      name: vlmcp
    set:
      horizontalPodAutoscaler.enabled: true
    asserts:
      - isKind:
          of: HorizontalPodAutoscaler
      - equal:
          path: spec.scaleTargetRef.kind
          value: Deployment
      - equal:
          path: spec.scaleTargetRef.apiVersion
          value: apps/v1
      - equal:
          path: spec.scaleTargetRef.name
          value: vlmcp-victoria-logs-mcp
      - equal:
          path: metadata.name
          value: vlmcp-victoria-logs-mcp
      - equal:
          path: spec.minReplicas
          value: 2
      - equal:
          path: spec.maxReplicas
          value: 10

  - it: renders metrics and behavior
    set:
      horizontalPodAutoscaler.enabled: true
      horizontalPodAutoscaler.minReplicas: 3
      horizontalPodAutoscaler.maxReplicas: 7
      horizontalPodAutoscaler.metrics:
        - type: Resource
          resource:
            name: cpu
            target:
              type: Utilization
              averageUtilization: 80
      horizontalPodAutoscaler.behavior:
        scaleDown:
          stabilizationWindowSeconds: 300
    asserts:
      - equal:
          path: spec.minReplicas
          value: 3
      - equal:
          path: spec.maxReplicas
          value: 7
      - equal:
          path: spec.metrics[0].resource.target.averageUtilization
          value: 80
      - equal:
          path: spec.behavior.scaleDown.stabilizationWindowSeconds
          value: 300
