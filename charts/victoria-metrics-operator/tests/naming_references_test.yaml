suite: naming references tests
set:
  serviceAccount.create: true
  rbac.create: true
  crds.cleanup.enabled: true
  admissionWebhooks.enabled: true
templates:
  - cleanup.yaml
  - crb.yaml
  - rb.yaml
  - server.yaml
  - webhook.yaml
tests:
  - it: "references follow resource names (legacy naming, default)"
    asserts:
      - equal:
          path: subjects[0].name
          value: RELEASE-NAME-victoria-metrics-operator
        template: crb.yaml
        documentIndex: 0
      - equal:
          path: roleRef.name
          value: RELEASE-NAME-victoria-metrics-operator
        template: crb.yaml
        documentIndex: 0
      - equal:
          path: subjects[0].name
          value: RELEASE-NAME-victoria-metrics-operator-cleanup-hook
        template: crb.yaml
        documentIndex: 1
      - equal:
          path: roleRef.name
          value: RELEASE-NAME-victoria-metrics-operator-cleanup-hook
        template: crb.yaml
        documentIndex: 1
      - equal:
          path: subjects[0].name
          value: RELEASE-NAME-victoria-metrics-operator
        template: rb.yaml
      - equal:
          path: roleRef.name
          value: RELEASE-NAME-victoria-metrics-operator
        template: rb.yaml
      - equal:
          path: spec.template.spec.serviceAccountName
          value: RELEASE-NAME-victoria-metrics-operator
        template: server.yaml
      - contains:
          path: spec.template.spec.volumes
          content:
            name: cert
            secret:
              defaultMode: 420
              secretName: RELEASE-NAME-victoria-metrics-operator-validation
        template: server.yaml
      - equal:
          path: spec.template.spec.serviceAccountName
          value: RELEASE-NAME-victoria-metrics-operator-cleanup-hook
        template: cleanup.yaml
      - equal:
          path: metadata.name
          value: RELEASE-NAME-victoria-metrics-operator-validation
        template: webhook.yaml
        documentSelector:
          path: kind
          value: Secret
      - equal:
          path: webhooks[0].clientConfig.service.name
          value: RELEASE-NAME-victoria-metrics-operator
        template: webhook.yaml
        documentSelector:
          path: kind
          value: ValidatingWebhookConfiguration
  - it: "references follow resource names (useLegacyNaming: false)"
    set:
      useLegacyNaming: false
    asserts:
      - equal:
          path: subjects[0].name
          value: vmoperator-RELEASE-NAME
        template: crb.yaml
        documentIndex: 0
      - equal:
          path: roleRef.name
          value: vmoperator-RELEASE-NAME
        template: crb.yaml
        documentIndex: 0
      - equal:
          path: subjects[0].name
          value: vmoperator-RELEASE-NAME-cleanup-hook
        template: crb.yaml
        documentIndex: 1
      - equal:
          path: roleRef.name
          value: vmoperator-RELEASE-NAME-cleanup-hook
        template: crb.yaml
        documentIndex: 1
      - equal:
          path: subjects[0].name
          value: vmoperator-RELEASE-NAME
        template: rb.yaml
      - equal:
          path: roleRef.name
          value: vmoperator-RELEASE-NAME
        template: rb.yaml
      - equal:
          path: spec.template.spec.serviceAccountName
          value: vmoperator-RELEASE-NAME
        template: server.yaml
      - contains:
          path: spec.template.spec.volumes
          content:
            name: cert
            secret:
              defaultMode: 420
              secretName: vmoperator-RELEASE-NAME-validation
        template: server.yaml
      - equal:
          path: spec.template.spec.serviceAccountName
          value: vmoperator-RELEASE-NAME-cleanup-hook
        template: cleanup.yaml
      - equal:
          path: metadata.name
          value: vmoperator-RELEASE-NAME-validation
        template: webhook.yaml
        documentSelector:
          path: kind
          value: Secret
      - equal:
          path: webhooks[0].clientConfig.service.name
          value: vmoperator-RELEASE-NAME
        template: webhook.yaml
        documentSelector:
          path: kind
          value: ValidatingWebhookConfiguration
