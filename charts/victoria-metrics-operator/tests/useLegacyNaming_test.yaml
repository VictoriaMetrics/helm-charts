suite: useLegacyNaming tests
set:
  podDisruptionBudget.enabled: true
  serviceMonitor.enabled: true
  serviceAccount.create: true
  rbac.create: true
  crds.cleanup.enabled: true
templates:
  - cleanup.yaml
  - crb.yaml
  - monitor.yaml
  - pdb.yaml
  - rb.yaml
  - role.yaml
  - server.yaml
  - service.yaml
  - serviceaccount.yaml
  - webhook.yaml
tests:
  - it: "resource names (legacy naming, default)"
    asserts:
      - equal:
          path: metadata.name
          value: RELEASE-NAME-victoria-metrics-operator-cleanup-hook
        template: cleanup.yaml
      - equal:
          path: metadata.name
          value: RELEASE-NAME-victoria-metrics-operator
        template: crb.yaml
        documentIndex: 0
      - equal:
          path: metadata.name
          value: RELEASE-NAME-victoria-metrics-operator-cleanup-hook
        template: crb.yaml
        documentIndex: 1
      - equal:
          path: metadata.name
          value: RELEASE-NAME-victoria-metrics-operator
        template: monitor.yaml
      - equal:
          path: metadata.name
          value: RELEASE-NAME-victoria-metrics-operator
        template: pdb.yaml
      - equal:
          path: metadata.name
          value: RELEASE-NAME-victoria-metrics-operator
        template: rb.yaml
      - equal:
          path: metadata.name
          value: RELEASE-NAME-victoria-metrics-operator
        template: role.yaml
        documentIndex: 0
      - equal:
          path: metadata.name
          value: RELEASE-NAME-victoria-metrics-operator
        template: role.yaml
        documentIndex: 1
      - equal:
          path: metadata.name
          value: RELEASE-NAME-victoria-metrics-operator-cleanup-hook
        template: role.yaml
        documentIndex: 2
      - equal:
          path: metadata.name
          value: RELEASE-NAME-victoria-metrics-operator-victoriametrics-admin
        template: role.yaml
        documentIndex: 3
      - equal:
          path: metadata.name
          value: RELEASE-NAME-victoria-metrics-operator-victoriametrics-view
        template: role.yaml
        documentIndex: 4
      - equal:
          path: metadata.name
          value: RELEASE-NAME-victoria-metrics-operator
        template: server.yaml
      - equal:
          path: metadata.name
          value: RELEASE-NAME-victoria-metrics-operator
        template: service.yaml
      - equal:
          path: metadata.name
          value: RELEASE-NAME-victoria-metrics-operator
        template: serviceaccount.yaml
        documentIndex: 0
      - equal:
          path: metadata.name
          value: RELEASE-NAME-victoria-metrics-operator-cleanup-hook
        template: serviceaccount.yaml
        documentIndex: 1
      - equal:
          path: metadata.name
          value: RELEASE-NAME-victoria-metrics-operator-admission
        template: webhook.yaml
        documentIndex: 0
      - equal:
          path: metadata.name
          value: RELEASE-NAME-victoria-metrics-operator-validation
        template: webhook.yaml
        documentIndex: 1
  - it: "resource names (useLegacyNaming: false)"
    set:
      useLegacyNaming: false
    asserts:
      - equal:
          path: metadata.name
          value: vmoperator-RELEASE-NAME-cleanup-hook
        template: cleanup.yaml
      - equal:
          path: metadata.name
          value: vmoperator-RELEASE-NAME
        template: crb.yaml
        documentIndex: 0
      - equal:
          path: metadata.name
          value: vmoperator-RELEASE-NAME-cleanup-hook
        template: crb.yaml
        documentIndex: 1
      - equal:
          path: metadata.name
          value: vmoperator-RELEASE-NAME
        template: monitor.yaml
      - equal:
          path: metadata.name
          value: vmoperator-RELEASE-NAME
        template: pdb.yaml
      - equal:
          path: metadata.name
          value: vmoperator-RELEASE-NAME
        template: rb.yaml
      - equal:
          path: metadata.name
          value: vmoperator-RELEASE-NAME
        template: role.yaml
        documentIndex: 0
      - equal:
          path: metadata.name
          value: vmoperator-RELEASE-NAME
        template: role.yaml
        documentIndex: 1
      - equal:
          path: metadata.name
          value: vmoperator-RELEASE-NAME-cleanup-hook
        template: role.yaml
        documentIndex: 2
      - equal:
          path: metadata.name
          value: vmoperator-RELEASE-NAME-victoriametrics-admin
        template: role.yaml
        documentIndex: 3
      - equal:
          path: metadata.name
          value: vmoperator-RELEASE-NAME-victoriametrics-view
        template: role.yaml
        documentIndex: 4
      - equal:
          path: metadata.name
          value: vmoperator-RELEASE-NAME
        template: server.yaml
      - equal:
          path: metadata.name
          value: vmoperator-RELEASE-NAME
        template: service.yaml
      - equal:
          path: metadata.name
          value: vmoperator-RELEASE-NAME
        template: serviceaccount.yaml
        documentIndex: 0
      - equal:
          path: metadata.name
          value: vmoperator-RELEASE-NAME-cleanup-hook
        template: serviceaccount.yaml
        documentIndex: 1
      - equal:
          path: metadata.name
          value: vmoperator-RELEASE-NAME-admission
        template: webhook.yaml
        documentIndex: 0
      - equal:
          path: metadata.name
          value: vmoperator-RELEASE-NAME-validation
        template: webhook.yaml
        documentIndex: 1
