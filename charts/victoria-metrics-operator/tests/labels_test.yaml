suite: labels and selectors
set:
  crds.cleanup.enabled: true
  podDisruptionBudget.enabled: true
  rbac.create: true
  serviceAccount.create: true
  serviceMonitor.enabled: true
capabilities:
  apiVersions:
    - operator.victoriametrics.com/v1beta1
    - monitoring.coreos.com/v1
    - gateway.networking.k8s.io/v1
    - autoscaling.k8s.io/v1
templates:
  - monitor.yaml
  - pdb.yaml
  - server.yaml
  - service.yaml
  - cleanup.yaml
  - crb.yaml
  - rb.yaml
  - role.yaml
  - serviceaccount.yaml
  - webhook.yaml
tests:
  - it: "selectors match pod labels with operator naming"
    set:
      useLegacyNaming: false
    asserts:
      - equal:
          path: spec.selector.matchLabels
          value:
            app.kubernetes.io/component: monitoring
            app.kubernetes.io/instance: RELEASE-NAME
            app.kubernetes.io/name: vmoperator
        template: pdb.yaml
      - equal:
          path: spec.selector
          value:
            app.kubernetes.io/component: monitoring
            app.kubernetes.io/instance: RELEASE-NAME
            app.kubernetes.io/name: vmoperator
        template: service.yaml
      - equal:
          path: spec.selector.matchLabels
          value:
            app.kubernetes.io/component: monitoring
            app.kubernetes.io/instance: RELEASE-NAME
            app.kubernetes.io/name: vmoperator
        template: server.yaml
      - isSubset:
          path: spec.template.metadata.labels
          content:
            app.kubernetes.io/component: monitoring
            app.kubernetes.io/instance: RELEASE-NAME
            app.kubernetes.io/name: vmoperator
        template: server.yaml
      - equal:
          path: spec.selector.matchLabels
          value:
            app.kubernetes.io/component: monitoring
            app.kubernetes.io/instance: RELEASE-NAME
            app.kubernetes.io/name: vmoperator
        template: monitor.yaml
  - it: "selectors match pod labels with legacy naming"
    set:
      useLegacyNaming: true
    asserts:
      - equal:
          path: spec.selector.matchLabels
          value:
            app.kubernetes.io/instance: RELEASE-NAME
            app.kubernetes.io/name: victoria-metrics-operator
        template: pdb.yaml
      - equal:
          path: spec.selector
          value:
            app.kubernetes.io/instance: RELEASE-NAME
            app.kubernetes.io/name: victoria-metrics-operator
        template: service.yaml
      - equal:
          path: spec.selector.matchLabels
          value:
            app.kubernetes.io/instance: RELEASE-NAME
            app.kubernetes.io/name: victoria-metrics-operator
        template: server.yaml
      - isSubset:
          path: spec.template.metadata.labels
          content:
            app.kubernetes.io/instance: RELEASE-NAME
            app.kubernetes.io/name: victoria-metrics-operator
        template: server.yaml
      - equal:
          path: spec.selector.matchLabels
          value:
            app.kubernetes.io/instance: RELEASE-NAME
            app.kubernetes.io/name: victoria-metrics-operator
        template: monitor.yaml
