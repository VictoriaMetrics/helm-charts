{{- $upgrade := .Values.upgrade }}
{{- if and $upgrade.enabled $upgrade.serviceAccount.create }}
{{- $ctx := dict "helm" . }}
{{- $fullname := include "vm.plain.fullname" $ctx }}
{{- $ns := include "vm.namespace" $ctx }}
{{- $sa := $upgrade.serviceAccount }}
apiVersion: v1
kind: ServiceAccount
automountServiceAccountToken: {{ $sa.automountServiceAccountToken }}
metadata:
  name: {{ include "crds.upgrade.name" . }}
  namespace: {{ $ns }}
  {{- $hookAnnotations := include "crds.upgrade.hookAnnotations" (dict "hookWeight" "-4") | fromYaml }}
  {{- $_ := set $ctx "extraAnnotations" (mergeOverwrite $hookAnnotations ($sa.annotations | default dict)) }}
  annotations: {{ include "vm.annotations" $ctx | nindent 4 }}
  {{- $_ := unset $ctx "extraAnnotations" }}
  {{- $extraLabels := $sa.labels | default dict }}
  {{- $_ := set $extraLabels "app.kubernetes.io/component" "upgrade-crds" }}
  {{- $_ := set $ctx "extraLabels" $extraLabels }}
  labels: {{ include "vm.labels" $ctx | nindent 4 }}
  {{- $_ := unset $ctx "extraLabels" }}
{{- end }}
