{{- if .Values.upgrade.enabled }}
{{- $ctx := dict "helm" . }}
{{- $upgrade := .Values.upgrade }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "crds.upgrade.serviceAccountName" $ctx }}
  namespace: {{ template "vm.namespace" $ctx }}
  {{- $_ := set $ctx "extraAnnotations" (include "crds.upgrade.hookAnnotations" (dict "hookWeight" "-2") | fromYaml) }}
  annotations: {{ include "vm.annotations" $ctx | nindent 4 }}
  {{- $_ := unset $ctx "extraAnnotations" }}
  {{- $_ := set $ctx "extraLabels" (dict "app.kubernetes.io/component" "upgrade-crds") }}
  labels: {{ include "vm.labels" $ctx | nindent 4 }}
  {{- $_ := unset $ctx "extraLabels" }}
binaryData:
  crd.yaml.bz2: {{ .Files.Get "files/crd.yaml.bz2" | b64enc }}
{{- end }}
