{{- $ctx := dict "helm" . "kindOverride" "vmoperator" }}
{{- $fullname := include "vm.plain.fullname" $ctx }}
{{- $ns := include "vm.namespace" $ctx }}
{{- if .Values.rbac.create }}
kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: {{ $fullname }}
  {{- $_ := set $ctx "extraLabels" .Values.extraLabels }}
  labels: {{ include "vm.labels" $ctx | nindent 4 }}
  {{- $_ := unset $ctx "extraLabels" }}
  {{- $_ := set $ctx "extraAnnotations" .Values.annotations }}
  {{- with (include "vm.annotations" $ctx) }}
  annotations: {{ . | nindent 4 }}
  {{- end }}
  {{- $_ := unset $ctx "extraAnnotations" }}
subjects:
- kind: ServiceAccount
  name: {{ (.Values.serviceAccount).name | default $fullname }}
  namespace: {{ $ns }}
roleRef:
  kind: ClusterRole
  name: {{ $fullname }}
  apiGroup: rbac.authorization.k8s.io
{{- end -}}
{{- if .Values.crds.cleanup.enabled }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $fullname }}-cleanup-hook
  namespace: {{ $ns }}
  labels: {{ include "vm.labels" $ctx | nindent 4 }}
  {{- $_ := set $ctx "extraAnnotations" (include "vm-operator.cleanup.annotations" (dict "hookWeight" "-4") | fromYaml) }}
  annotations: {{ include "vm.annotations" $ctx | nindent 4 }}
  {{- $_ := unset $ctx "extraAnnotations" }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $fullname }}-cleanup-hook
subjects:
- kind: ServiceAccount
  name: {{ $fullname }}-cleanup-hook
  namespace: {{ $ns }}
{{- end }}
