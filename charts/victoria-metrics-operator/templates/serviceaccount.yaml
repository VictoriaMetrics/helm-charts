{{- $ctx := dict "helm" . "kindOverride" "vmoperator" }}
{{- $fullname := include "vm.plain.fullname" $ctx }}
{{- $ns := include "vm.namespace" $ctx }}
{{- $sa := .Values.serviceAccount }}
{{- if $sa.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ tpl ($sa.name | default $fullname) $ctx }}
  namespace: {{ $ns }}
  {{- $_ := set $ctx "extraLabels" .Values.extraLabels }}
  labels: {{ include "vm.labels" $ctx | nindent 4 }}
  {{- $_ := unset $ctx "extraLabels" }}
  {{- $_ := set $ctx "extraAnnotations" .Values.annotations }}
  {{- with (include "vm.annotations" $ctx) }}
  annotations: {{ . | nindent 4 }}
  {{- end }}
  {{- $_ := unset $ctx "extraAnnotations" }}
automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
{{- end }}
{{- if .Values.crds.cleanup.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $fullname }}-cleanup-hook
  namespace: {{ $ns }}
  labels: {{ include "vm.labels" $ctx | nindent 4 }}
  {{- $_ := set $ctx "extraAnnotations" (include "vm-operator.cleanup.annotations" (dict "hookWeight" "-5") | fromYaml) }}
  annotations: {{ include "vm.annotations" $ctx | nindent 4 }}
  {{- $_ := unset $ctx "extraAnnotations" }}
{{- end }}
