{{- $rules := dict }}
{{- $crds := .Files.Get "crd.yaml" | splitList "---" }}
{{- $groups := dict }}
{{- range $crds }}
  {{- $crd := . | fromYaml }}
  {{- $group := $crd.spec.group }}
  {{- $plural:= $crd.spec.names.plural }}
  {{- $resources := get $groups $group | default (list) }}
  {{- $resources = concat $resources (list $plural (printf "%s/finalizers" $plural) (printf "%s/status" $plural)) }}
  {{- $groups = set $groups $group $resources }}
{{- end }}

{{- $verbs := dict "admin" (list "*") "view" (list "get" "list" "watch") }}
{{- range $group, $resources := $groups }}
  {{- range $name, $v := $verbs }}
    {{- $r := index $rules $name | default list -}}
    {{- $r = append $r (dict "apiGroups" (list $group) "resources" $resources "verbs" $v) -}}
    {{- $_ := set $rules $name $r }}
  {{- end }}
{{- end -}}

{{- $ctx := dict "helm" . "extraLabels" .Values.extraLabels }}
{{- $fullname := include "vm.plain.fullname" $ctx }}
{{- $ns := include "vm.namespace" $ctx }}

{{- if .Values.rbac.create }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $fullname }}
  labels: {{ include "vm.labels" $ctx | nindent 4 }}
  {{- with .Values.annotations }}
  annotations: {{ toYaml . | nindent 4 }}
  {{- end }}
  namespace: {{ $ns }}
rules:
- apiGroups:
  - coordination.k8s.io
  verbs:
  - create
  - get
  - update
  resources:
  - leases

{{- $watchNamespaces := (fromYaml (tpl (toYaml (dict "ns" .Values.watchNamespaces)) .)).ns }}
{{- $selfNamespace := $ns }}
{{- $watchSelfNamespace := (and (eq (len $watchNamespaces) 1) (eq (first $watchNamespaces) $selfNamespace)) }}
{{- if not $watchSelfNamespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $fullname }}
  labels: {{ include "vm.labels" $ctx | nindent 4 }}
  {{- with .Values.annotations }}
  annotations: {{ toYaml . | nindent 4 }}
  {{- end }}
rules:
- nonResourceURLs: {{ toYaml .Values.allowedMetricsEndpoints | nindent 2 }}
  verbs:
  - get
  - watch
  - list
{{- end }}
{{- /* do not add permissions here, please add a +kubebuilder:rbac marker in the operator repo */ -}}
{{- /* these rules come from /victoria-metrics-operator/operator-role.yaml, synced on operator release */}}
{{- $gated := dict
      "autoscaling.k8s.io/verticalpodautoscalers"        .Values.operator.vpa_support
      "gateway.networking.k8s.io/httproutes"             .Values.operator.gateway_support
      "gateway.networking.k8s.io/httproutes/finalizers"  .Values.operator.gateway_support }}
{{- $gatedGroups := list "autoscaling.k8s.io" "gateway.networking.k8s.io" }}
{{- $opRole := required "operator-role.yaml is missing or empty" (.Files.Get "operator-role.yaml") | fromYaml }}
{{- range $r := $opRole.rules }}
{{- if and $r.resources (not (has "operator.victoriametrics.com" $r.apiGroups)) }}
{{- $keep := list }}
{{- range $res := $r.resources }}
{{- $enabled := true }}
{{- range $g := $r.apiGroups }}
{{- $key := printf "%s/%s" $g $res }}
{{- if hasKey $gated $key }}{{- $enabled = get $gated $key }}
{{- else if has $g $gatedGroups }}{{- fail (printf "unclassified resource %q in feature-gated apiGroup %q - add it to the $gated map in templates/role.yaml" $res $g) }}
{{- end }}
{{- end }}
{{- if $enabled }}{{- $keep = append $keep $res }}{{- end }}
{{- end }}
{{- if $keep }}
- apiGroups: {{ toYaml $r.apiGroups | nindent 2 }}
  resources: {{ toYaml $keep | nindent 2 }}
  verbs: {{ toYaml $r.verbs | nindent 2 }}
{{- end }}
{{- end }}
{{- end }}
{{- /* backwards compatibility: operator releases before v0.75.0 request the legacy */ -}}
{{- /* extensions apiGroup when building the cluster-wide ClusterRole for VMAgent, or */ -}}
{{- /* for VMSingle with ingestOnlyMode: false. Since the rules above no longer grant */ -}}
{{- /* escalate, this chart must hold that permission to grant it onward. */ -}}
{{- /* not needed for operator v0.75.0+; remove when support for older releases is dropped */}}
- apiGroups:
  - extensions
  resources:
  - ingresses
  verbs:
  - get
  - list
  - watch
{{- with $rules.admin }}
{{ toYaml . }}
{{- end }}
{{- end }}
{{- if .Values.crds.cleanup.enabled }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $fullname }}-cleanup-hook
  namespace: {{ $ns }}
  labels: {{ include "vm.labels" $ctx | nindent 4 }}
  annotations: {{ include "vm-operator.cleanup.annotations" (dict "hookWeight" "-5") | nindent 4 }}
rules: {{ toYaml $rules.admin | nindent 2 }}
{{- end }}

{{- if .Values.rbac.aggregatedClusterRoles.enabled }}
{{- /* This template generates readonly and admin cluster roles for */ -}}
{{- /* each CRD present in the helm chart.  The clusterroles use the */ -}}
{{- /* kubernetes clusterrole aggregation feature to include these */ -}}
{{- /* cluster roles into the default view and admin roles */ -}}
{{- /* See https://kubernetes.io/docs/reference/access-authn-authz/rbac/#aggregated-clusterroles */}}
--- 
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $fullname }}-victoriametrics-admin
  labels:
    {{- include "vm.labels" $ctx | nindent 4 }}
    {{- .Values.rbac.aggregatedClusterRoles.labels.admin | toYaml | nindent 4 }}
rules: {{ toYaml ($rules.admin | default list) | nindent 2 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $fullname }}-victoriametrics-view
  labels:
    {{- include "vm.labels" $ctx | nindent 4 }}
    {{- .Values.rbac.aggregatedClusterRoles.labels.view | toYaml | nindent 4 }}
rules: {{ toYaml ($rules.view | default list) | nindent 2 }}
{{- end }}
