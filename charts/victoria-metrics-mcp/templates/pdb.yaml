{{- $pdb := .Values.podDisruptionBudget }}
{{- if $pdb.enabled }}
{{- /* presence checks rather than truthiness so that 0 is honoured */}}
{{- $min := $pdb.minAvailable }}
{{- $max := $pdb.maxUnavailable }}
{{- $hasMin := and (not (kindIs "invalid" $min)) (ne (toString $min) "") }}
{{- $hasMax := and (not (kindIs "invalid" $max)) (ne (toString $max) "") }}
{{- if and $hasMin $hasMax }}
{{- fail ".Values.podDisruptionBudget.minAvailable and maxUnavailable are mutually exclusive" }}
{{- end }}
{{- if not (or $hasMin $hasMax) }}
{{- fail ".Values.podDisruptionBudget requires exactly one of minAvailable or maxUnavailable when enabled" }}
{{- end }}
{{- $ctx := dict "helm" . "kindOverride" "vmmcp" }}
{{- $fullname := include "vm.plain.fullname" $ctx }}
{{- $ns := include "vm.namespace" $ctx }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $fullname }}
  namespace: {{ $ns }}
  {{- $_ := set $ctx "extraLabels" $pdb.labels }}
  labels: {{ include "vm.labels" $ctx | nindent 4 }}
  {{- $_ := unset $ctx "extraLabels" }}
spec:
  {{- if $hasMin }}
  minAvailable: {{ $min }}
  {{- end }}
  {{- if $hasMax }}
  maxUnavailable: {{ $max }}
  {{- end }}
  {{- with $pdb.unhealthyPodEvictionPolicy }}
  unhealthyPodEvictionPolicy: {{ . }}
  {{- end }}
  selector:
    matchLabels: {{ include "vm.selectorLabels" $ctx | nindent 6 }}
{{- end }}
