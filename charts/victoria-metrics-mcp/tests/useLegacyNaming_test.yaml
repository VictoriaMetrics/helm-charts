suite: useLegacyNaming tests
set:
  vm.entrypoint: http://example.com
  serviceAccount.create: true
  ingress.enabled: true
  route.enabled: true
  horizontalPodAutoscaler.enabled: true
  podDisruptionBudget.enabled: true
  podDisruptionBudget.minAvailable: 1
  networkPolicy.enabled: true
  scrape.enabled: true
templates:
  - deployment.yaml
  - hpa.yaml
  - ingress.yaml
  - networkpolicy.yaml
  - pdb.yaml
  - route.yaml
  - scrape.yaml
  - service.yaml
  - serviceaccount.yaml
tests:
  - it: "resource names (legacy naming, default)"
    asserts:
      - equal:
          path: metadata.name
          value: RELEASE-NAME-victoria-metrics-mcp
        template: deployment.yaml
      - equal:
          path: metadata.name
          value: RELEASE-NAME-victoria-metrics-mcp
        template: hpa.yaml
      - equal:
          path: metadata.name
          value: RELEASE-NAME-victoria-metrics-mcp
        template: ingress.yaml
      - equal:
          path: metadata.name
          value: RELEASE-NAME-victoria-metrics-mcp
        template: networkpolicy.yaml
      - equal:
          path: metadata.name
          value: RELEASE-NAME-victoria-metrics-mcp
        template: pdb.yaml
      - equal:
          path: metadata.name
          value: RELEASE-NAME-victoria-metrics-mcp
        template: route.yaml
      - equal:
          path: spec.rules[0].backendRefs[0].name
          value: RELEASE-NAME-victoria-metrics-mcp
        template: route.yaml
      - equal:
          path: metadata.name
          value: RELEASE-NAME-victoria-metrics-mcp
        template: scrape.yaml
      - equal:
          path: metadata.name
          value: RELEASE-NAME-victoria-metrics-mcp
        template: service.yaml
      - equal:
          path: metadata.name
          value: RELEASE-NAME-victoria-metrics-mcp
        template: serviceaccount.yaml
  - it: "resource names, useLegacyNaming=false"
    set:
      useLegacyNaming: false
    asserts:
      - equal:
          path: metadata.name
          value: vmmcp-RELEASE-NAME
        template: deployment.yaml
      - equal:
          path: metadata.name
          value: vmmcp-RELEASE-NAME
        template: hpa.yaml
      - equal:
          path: metadata.name
          value: vmmcp-RELEASE-NAME
        template: ingress.yaml
      - equal:
          path: metadata.name
          value: vmmcp-RELEASE-NAME
        template: networkpolicy.yaml
      - equal:
          path: metadata.name
          value: vmmcp-RELEASE-NAME
        template: pdb.yaml
      - equal:
          path: metadata.name
          value: vmmcp-RELEASE-NAME
        template: route.yaml
      - equal:
          path: spec.rules[0].backendRefs[0].name
          value: vmmcp-RELEASE-NAME
        template: route.yaml
      - equal:
          path: metadata.name
          value: vmmcp-RELEASE-NAME
        template: scrape.yaml
      - equal:
          path: metadata.name
          value: vmmcp-RELEASE-NAME
        template: service.yaml
      - equal:
          path: metadata.name
          value: vmmcp-RELEASE-NAME
        template: serviceaccount.yaml
