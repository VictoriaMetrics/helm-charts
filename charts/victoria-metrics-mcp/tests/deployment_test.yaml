suite: Deployment
templates:
  - deployment.yaml
set:
  vm.entrypoint: http://vmsingle:8428
tests:
  - it: sets replicas by default
    set:
      replicaCount: 3
    asserts:
      - equal:
          path: spec.replicas
          value: 3
      - notExists:
          path: spec.strategy

  - it: omits replicas when HPA is enabled
    set:
      replicaCount: 3
      horizontalPodAutoscaler.enabled: true
    asserts:
      - notExists:
          path: spec.replicas

  - it: renders strategy and terminationGracePeriodSeconds
    set:
      strategy:
        type: RollingUpdate
        rollingUpdate:
          maxUnavailable: 0
      terminationGracePeriodSeconds: 120
    asserts:
      - equal:
          path: spec.strategy.rollingUpdate.maxUnavailable
          value: 0
      - equal:
          path: spec.template.spec.terminationGracePeriodSeconds
          value: 120

  - it: defaults topologySpreadConstraints labelSelector to selector labels
    set:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
    asserts:
      - equal:
          path: spec.template.spec.topologySpreadConstraints[0].topologyKey
          value: topology.kubernetes.io/zone
      - equal:
          path: spec.template.spec.topologySpreadConstraints[0].labelSelector.matchLabels["app.kubernetes.io/name"]
          value: victoria-metrics-mcp

  - it: keeps an explicit topologySpreadConstraints labelSelector
    set:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              foo: bar
    asserts:
      - equal:
          path: spec.template.spec.topologySpreadConstraints[0].labelSelector.matchLabels
          value:
            foo: bar

  - it: sources cloudAPIKey from a secret when given a map
    set:
      vm.cloudAPIKey:
        secretKeyRef:
          name: vmc-api-key
          key: key
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: VMC_API_KEY
            valueFrom:
              secretKeyRef:
                name: vmc-api-key
                key: key

  - it: keeps a plain cloudAPIKey string inline
    set:
      vm.cloudAPIKey: some-key
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: VMC_API_KEY
            value: some-key

  - it: rejects unsupported vm.type
    set:
      vm.type: multi
    asserts:
      - failedTemplate:
          errorMessage: vm.type="multi" is not supported. Use 'single' or 'cluster' instead.

  - it: accepts cluster vm.type
    set:
      vm.type: cluster
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: VM_INSTANCE_TYPE
            value: cluster

  - it: omits optional pod and container extras by default
    asserts:
      - notExists:
          path: spec.template.spec.priorityClassName
      - notExists:
          path: spec.template.spec.initContainers
      - notExists:
          path: spec.template.spec.containers[0].envFrom
      - notExists:
          path: spec.template.spec.containers[0].startupProbe
      - notExists:
          path: spec.template.spec.containers[0].lifecycle
      - lengthEqual:
          path: spec.template.spec.containers
          count: 1

  - it: renders pod and container extras
    set:
      priorityClassName: high
      initContainers:
        - name: init
          image: busybox
      extraContainers:
        - name: sidecar
          image: sidecar:latest
      envFrom:
        - secretRef:
            name: extra-env
      lifecycle:
        preStop:
          exec:
            command: ["sleep", "10"]
      startupProbe:
        httpGet:
          path: /health/readiness
          port: http
        failureThreshold: 30
    asserts:
      - equal:
          path: spec.template.spec.priorityClassName
          value: high
      - equal:
          path: spec.template.spec.initContainers[0].name
          value: init
      - lengthEqual:
          path: spec.template.spec.containers
          count: 2
      - equal:
          path: spec.template.spec.containers[1].name
          value: sidecar
      - equal:
          path: spec.template.spec.containers[0].envFrom[0].secretRef.name
          value: extra-env
      - equal:
          path: spec.template.spec.containers[0].lifecycle.preStop.exec.command
          value: ["sleep", "10"]
      - equal:
          path: spec.template.spec.containers[0].startupProbe.failureThreshold
          value: 30

  - it: honours terminationGracePeriodSeconds 0
    set:
      terminationGracePeriodSeconds: 0
    asserts:
      - equal:
          path: spec.template.spec.terminationGracePeriodSeconds
          value: 0

  - it: omits terminationGracePeriodSeconds when unset
    asserts:
      - notExists:
          path: spec.template.spec.terminationGracePeriodSeconds

  - it: keeps an explicit empty topologySpreadConstraints labelSelector
    set:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector: {}
    asserts:
      - exists:
          path: spec.template.spec.topologySpreadConstraints[0].labelSelector
      - notExists:
          path: spec.template.spec.topologySpreadConstraints[0].labelSelector.matchLabels
