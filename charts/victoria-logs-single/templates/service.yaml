{{- $app := .Values.server }}
{{- $mode := $app.mode }}
{{- $service := $app.service }}
{{- if and $app.enabled (not (include "vm.operator.enabled" .)) -}}
{{- $ctx := dict "helm" . "appKey" "server" "kindOverride" "vlsingle" }}
{{- $fullname := include "vm.plain.fullname" $ctx }}
{{- $ns := include "vm.namespace" $ctx }}
---
apiVersion: v1
kind: Service
metadata:
  {{- with $service.annotations }}
  annotations: {{ toYaml . | nindent 4 }}
  {{- end }}
  {{- $_ := set $ctx "extraLabels" $app.service.labels }}
  labels: {{ include "vm.labels" $ctx | nindent 4 }}
  {{- $_ := unset $ctx "extraLabels" }}
  name: {{ $fullname }}
  namespace: {{ $ns }}
spec:
  {{- with $service.trafficDistribution }}
  trafficDistribution: {{ . }}
  {{- end }}
  {{- $type := $service.type }}
  {{- if and (not $type) (eq $mode "statefulSet") }}
    {{- $type = "ClusterIP" }}
  {{- end }}
  type: {{ $type }}
  {{- if eq $type "ClusterIP" }}
  {{- $clusterIP := $service.clusterIP }}
  {{- if kindIs "invalid" $clusterIP }}
    {{- $clusterIP = ternary "" "None" (eq (include "vm.useLegacyNaming" $ctx) "false") }}
  {{- end }}
  {{- with $clusterIP }}
  clusterIP: {{ . }}
  {{- end }}
  {{- end }}
  {{- with $service.externalIPs }}
  externalIPs: {{ toYaml . | nindent 4 }}
  {{- end }}
  {{- with $service.loadBalancerIP }}
  loadBalancerIP: {{ . }}
  {{- end }}
  {{- with $service.loadBalancerSourceRanges }}
  loadBalancerSourceRanges: {{ toYaml . | nindent 4 }}
  {{- end }}
  {{- with $service.healthCheckNodePort }}
  healthCheckNodePort: {{ . }}
  {{- end }}
  {{- with $service.externalTrafficPolicy }}
  externalTrafficPolicy: {{ . }}
  {{- end }}
  {{- with $service.ipFamilyPolicy }}
  ipFamilyPolicy: {{ . }}
  {{- end }}
  {{- with $service.ipFamilies }}
  ipFamilies: {{ toYaml . | nindent 4 }}
  {{- end }}
  ports:
    {{- $overrides := $service.portOverrides | default dict }}
    {{- $extraArgs := $app.extraArgs | default dict }}
    {{- $httpAddr := $extraArgs.httpListenAddr -}}
    {{- range ternary $app.http (list (dict "name" "http" "value" $httpAddr "primary" true)) (empty $httpAddr) }}
    {{- $override := dig .name dict $overrides }}
    - name: {{ .name }}
      {{- $port := include "vm.port.from.flag" (dict "flag" .value "default" "9428") }}
      {{- $defaultPort := ternary ($service.servicePort | default $port) $port (and (.primary | default false) (not (empty $service.servicePort))) }}
      port: {{ $override.port | default $defaultPort }}
      protocol: {{ $override.protocol | default "TCP" }}
      {{- $defaultTargetPort := ternary $service.targetPort .name (and (.primary | default false) (not (empty $service.targetPort))) }}
      targetPort: {{ $override.targetPort | default $defaultTargetPort }}
      {{- $defaultNodePort := "" }}
      {{- if and .primary $service.nodePort }}
      {{- $defaultNodePort = $service.nodePort }}
      {{- end }}
      {{- with ($override.nodePort | default $defaultNodePort) }}
      nodePort: {{ . }}
      {{- end }}
      {{- with $override.appProtocol }}
      appProtocol: {{ . }}
      {{- end }}
    {{- end }}
    {{- $syslogTCPAddr := index $extraArgs "syslog.listenAddr.tcp" -}}
    {{- range ternary $app.syslog.tcp (list (dict "name" "syslog-tcp" "value" $syslogTCPAddr)) (empty $syslogTCPAddr) }}
    {{- $override := dig .name dict $overrides }}
    - name: {{ .name }}
      port: {{ $override.port | default (include "vm.port.from.flag" (dict "flag" .value)) }}
      protocol: {{ $override.protocol | default "TCP" }}
      targetPort: {{ $override.targetPort | default .name }}
      {{- with $override.nodePort }}
      nodePort: {{ . }}
      {{- end }}
      {{- with $override.appProtocol }}
      appProtocol: {{ . }}
      {{- end }}
    {{- end }}
    {{- $syslogUDPAddr := index $extraArgs "syslog.listenAddr.udp" -}}
    {{- range ternary $app.syslog.udp (list (dict "name" "syslog-udp" "value" $syslogUDPAddr)) (empty $syslogUDPAddr) }}
    {{- $override := dig .name dict $overrides }}
    - name: {{ .name }}
      port: {{ $override.port | default (include "vm.port.from.flag" (dict "flag" .value)) }}
      protocol: {{ $override.protocol | default "UDP" }}
      targetPort: {{ $override.targetPort | default .name }}
      {{- with $override.nodePort }}
      nodePort: {{ . }}
      {{- end }}
      {{- with $override.appProtocol }}
      appProtocol: {{ . }}
      {{- end }}
    {{- end }}
    {{- range $service.extraPorts }}
    {{- $override := dig .name dict $overrides }}
    - name: {{ .name }}
      port: {{ $override.port | default .port }}
      protocol: {{ $override.protocol | default (.protocol | default "TCP") }}
      targetPort: {{ $override.targetPort | default .targetPort }}
      {{- with $override.nodePort }}
      nodePort: {{ . }}
      {{- end }}
      {{- with $override.appProtocol }}
      appProtocol: {{ . }}
      {{- end }}
    {{- end }}
  selector: {{ include "vm.selectorLabels" $ctx | nindent 4 }}
{{- end }}
