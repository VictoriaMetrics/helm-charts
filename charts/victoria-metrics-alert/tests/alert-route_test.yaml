suite: alert route templates test
templates:
  - alert-route.yaml
tests:
  - it: uses portOverrides.http.port as the backend port when servicePort and route.port are unset
    set:
      server:
        route:
          enabled: true
        service:
          portOverrides:
            http:
              port: 9999
    asserts:
      - equal:
          path: spec.rules[0].backendRefs[0].port
          value: 9999
  - it: route.port still takes precedence over portOverrides.http.port
    set:
      server:
        route:
          enabled: true
          port: 7777
        service:
          portOverrides:
            http:
              port: 9999
    asserts:
      - equal:
          path: spec.rules[0].backendRefs[0].port
          value: 7777
  - it: portOverrides.http.port takes precedence over servicePort when route.port is unset
    set:
      server:
        route:
          enabled: true
        service:
          servicePort: 8888
          portOverrides:
            http:
              port: 9999
    asserts:
      - equal:
          path: spec.rules[0].backendRefs[0].port
          value: 9999
