suite: naming references tests
set:
  server.datasource.url: http://vmsingle:8428
  server.ingress.enabled: true
  server.route.enabled: true
  alertmanager.enabled: true
  alertmanager.ingress.enabled: true
  alertmanager.route.enabled: true
  alertmanager.persistentVolume.enabled: true
  serviceAccount.create: true
templates:
  - alert-configmap.yaml
  - alert-ingress.yaml
  - alert-route.yaml
  - alert-server.yaml
  - alertmanager-secret.yaml
  - alertmanager-ingress.yaml
  - alertmanager-pvc.yaml
  - alertmanager-route.yaml
  - alertmanager-server.yaml
  - serviceaccount.yaml
tests:
  - it: "references follow resource names (legacy naming, default)"
    asserts:
      - equal:
          path: spec.rules[0].http.paths[0].backend.service.name
          value: RELEASE-NAME-victoria-metrics-alert-server
        template: alert-ingress.yaml
      - equal:
          path: spec.rules[0].http.paths[0].backend.service.name
          value: RELEASE-NAME-victoria-metrics-alert-alertmanager
        template: alertmanager-ingress.yaml
      - equal:
          path: spec.rules[0].backendRefs[0].name
          value: RELEASE-NAME-victoria-metrics-alert-server
        template: alert-route.yaml
      - equal:
          path: spec.rules[0].backendRefs[0].name
          value: RELEASE-NAME-victoria-metrics-alert-alertmanager
        template: alertmanager-route.yaml
      - contains:
          path: spec.template.spec.containers[0].args
          content: --notifier.url=http://RELEASE-NAME-victoria-metrics-alert-alertmanager.NAMESPACE.svc.cluster.local.:9093
        template: alert-server.yaml
      - equal:
          path: spec.template.spec.volumes[0].configMap.name
          value: RELEASE-NAME-victoria-metrics-alert-server-alert-rules-config
        template: alert-server.yaml
      - contains:
          path: spec.template.spec.volumes
          content:
            name: config
            secret:
              secretName: RELEASE-NAME-victoria-metrics-alert-alertmanager-config
        template: alertmanager-server.yaml
      - contains:
          path: spec.template.spec.volumes
          content:
            name: server-volume
            persistentVolumeClaim:
              claimName: RELEASE-NAME-victoria-metrics-alert-alertmanager
        template: alertmanager-server.yaml
      - equal:
          path: metadata.name
          value: RELEASE-NAME-victoria-metrics-alert-alertmanager
        template: alertmanager-pvc.yaml
      - equal:
          path: spec.template.spec.serviceAccountName
          value: RELEASE-NAME-victoria-metrics-alert
        template: alert-server.yaml
      - equal:
          path: spec.template.spec.serviceAccountName
          value: RELEASE-NAME-victoria-metrics-alert
        template: alertmanager-server.yaml
      - equal:
          path: metadata.name
          value: RELEASE-NAME-victoria-metrics-alert
        template: serviceaccount.yaml
  - it: "references follow resource names (useLegacyNaming: false); the shared ServiceAccount keeps its release-based name"
    set:
      useLegacyNaming: false
    asserts:
      - equal:
          path: spec.rules[0].http.paths[0].backend.service.name
          value: vmalert-RELEASE-NAME
        template: alert-ingress.yaml
      - equal:
          path: spec.rules[0].http.paths[0].backend.service.name
          value: vmalertmanager-RELEASE-NAME
        template: alertmanager-ingress.yaml
      - equal:
          path: spec.rules[0].backendRefs[0].name
          value: vmalert-RELEASE-NAME
        template: alert-route.yaml
      - equal:
          path: spec.rules[0].backendRefs[0].name
          value: vmalertmanager-RELEASE-NAME
        template: alertmanager-route.yaml
      - contains:
          path: spec.template.spec.containers[0].args
          content: --notifier.url=http://vmalertmanager-RELEASE-NAME.NAMESPACE.svc.cluster.local.:9093
        template: alert-server.yaml
      - equal:
          path: spec.template.spec.volumes[0].configMap.name
          value: vmalert-RELEASE-NAME-alert-rules-config
        template: alert-server.yaml
      - contains:
          path: spec.template.spec.volumes
          content:
            name: config
            secret:
              secretName: vmalertmanager-RELEASE-NAME-config
        template: alertmanager-server.yaml
      - contains:
          path: spec.template.spec.volumes
          content:
            name: server-volume
            persistentVolumeClaim:
              claimName: vmalertmanager-RELEASE-NAME
        template: alertmanager-server.yaml
      - equal:
          path: metadata.name
          value: vmalertmanager-RELEASE-NAME
        template: alertmanager-pvc.yaml
      - equal:
          path: spec.template.spec.serviceAccountName
          value: RELEASE-NAME-victoria-metrics-alert
        template: alert-server.yaml
      - equal:
          path: spec.template.spec.serviceAccountName
          value: RELEASE-NAME-victoria-metrics-alert
        template: alertmanager-server.yaml
      - equal:
          path: metadata.name
          value: RELEASE-NAME-victoria-metrics-alert
        template: serviceaccount.yaml
