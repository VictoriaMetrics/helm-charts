suite: alertmanager service templates test
chart:
  version: 0.1.1
  appVersion: 0.1.0
templates:
  - alertmanager-service.yaml
tests:
  - it: alertmanager service should match snapshot
    set:
      alertmanager:
        enabled: true
        image:
          tag: v0.0.0
    asserts:
      - matchSnapshot: {}
  - it: should render nodePort for alertmanager service
    set:
      alertmanager:
        enabled: true
        service:
          type: NodePort
          nodePort: 30093
        image:
          tag: v0.0.0
    asserts:
      - equal:
          path: spec.type
          value: NodePort
      - equal:
          path: spec.ports[0].nodePort
          value: 30093
  - it: should override port, protocol, targetPort and appProtocol via portOverrides
    set:
      alertmanager:
        enabled: true
        image:
          tag: v0.0.0
        service:
          portOverrides:
            web:
              port: 9999
              protocol: UDP
              targetPort: custom-target
              appProtocol: kubernetes.io/h2c
    asserts:
      - equal:
          path: spec.ports[0]
          value:
            name: web
            port: 9999
            protocol: UDP
            targetPort: custom-target
            appProtocol: kubernetes.io/h2c
  - it: should override mesh ports via portOverrides
    set:
      alertmanager:
        enabled: true
        mode: statefulSet
        replicaCount: 2
        image:
          tag: v0.0.0
        service:
          portOverrides:
            tcp-mesh:
              port: 9999
            udp-mesh:
              port: 9998
    asserts:
      - equal:
          path: spec.ports[1].port
          value: 9999
      - equal:
          path: spec.ports[2].port
          value: 9998
