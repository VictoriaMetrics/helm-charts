{{- if not (include "vm.operator.enabled" .) }}
{{- if .Values.serviceAccount.create -}}
{{- $names := list }}
{{- $ctxs := list (dict "helm" . "appKey" "server" "kindOverride" "vmalert") }}
{{- if .Values.alertmanager.enabled }}
  {{- $ctxs = append $ctxs (dict "helm" . "appKey" "alertmanager" "kindOverride" "vmalertmanager") }}
{{- end }}
{{- $ns := include "vm.namespace" (dict "helm" .) }}
{{- range $ctx := $ctxs }}
{{- $name := include "vmalert.sa.name" $ctx }}
{{- if not (has $name $names) }}
{{- $names = append $names $name }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: {{ $ns }}
  labels: {{ include "vm.labels" $ctx | nindent 4 }}
  {{- with $.Values.serviceAccount.annotations }}
  annotations: {{ toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- end }}
{{- end -}}
{{- end -}}
