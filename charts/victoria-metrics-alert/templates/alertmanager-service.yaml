{{- $app := .Values.alertmanager }}
{{- $mode := $app.mode }}
{{- $service := $app.service }}
{{- $ctx := dict "helm" . "appKey" "alertmanager" "kindOverride" "vmalertmanager" }}
{{- $fullname := include "vm.plain.fullname" $ctx }}
{{- $ns := include "vm.namespace" $ctx }}
{{- if and $app.enabled (not (include "vm.operator.enabled" .)) -}}
---
apiVersion: v1
kind: Service
metadata:
  namespace: {{ $ns }}
  {{- with $service.annotations }}
  annotations: {{ toYaml . | nindent 4 }}
  {{- end }}
  {{- $_ := set $ctx "extraLabels" $app.service.labels }}
  labels: {{ include "vm.labels" $ctx | nindent 4 }}
  {{- $_ := unset $ctx "extraLabels" }}
  name: {{ $fullname }}
spec:
  {{- with $service.trafficDistribution }}
  trafficDistribution: {{ . }}
  {{- end }}
  type: {{ $service.type }}
  {{- /* headless by default with non-legacy naming, as in VictoriaMetrics operator; explicit clusterIP always wins */}}
  {{- $headless := and (kindIs "invalid" $service.clusterIP) (eq $service.type "ClusterIP") (eq (include "vm.useLegacyNaming" $ctx) "false") }}
  {{- $clusterIP := ternary "None" ($service.clusterIP | default "") $headless }}
  {{- with $clusterIP }}
  clusterIP: {{ . }}
  {{- end }}
  {{- if or $service.publishNotReadyAddresses $headless }}
  publishNotReadyAddresses: true
  {{- end }}
  {{- with $service.externalIPs }}
  externalIPs: {{ toYaml . | nindent 4 }}
  {{- end }}
  {{- with $service.loadBalancerIP }}
  loadBalancerIP: {{ . }}
  {{- end }}
  {{- with $service.loadBalancerSourceRanges }}
  loadBalancerSourceRanges: {{ toYaml . | nindent 4 }}
  {{- end }}
  {{- with $service.healthCheckNodePort }}
  healthCheckNodePort: {{ . }}
  {{- end }}
  {{- with $service.externalTrafficPolicy }}
  externalTrafficPolicy: {{ . }}
  {{- end }}
  {{- with $service.ipFamilyPolicy }}
  ipFamilyPolicy: {{ . }}
  {{- end }}
  {{- with $service.ipFamilies }}
  ipFamilies: {{ toYaml . | nindent 4 }}
  {{- end }}
  ports:
    - name: {{ include "alertmanager.service.portName" $ctx }}
      port: {{ $service.servicePort }}
      targetPort: web
      protocol: TCP
      {{- if $service.nodePort }}
      nodePort: {{ $service.nodePort }}
      {{- end }}
    {{- if gt (int $app.replicaCount) 1 }}
    {{- $meshPort := include "vm.port.from.flag" (dict "flag" $app.cluster.listenAddress "default" "9094") }}
    - name: tcp-mesh
      port: {{ $meshPort }}
      targetPort: mesh-tcp
      protocol: TCP
    - name: udp-mesh
      port: {{ $meshPort }}
      targetPort: mesh-udp
      protocol: UDP
    {{- end }}
  selector: {{ include "vm.selectorLabels" $ctx | nindent 4 }}
{{- end }}
