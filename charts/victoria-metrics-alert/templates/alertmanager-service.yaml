{{- $app := .Values.alertmanager }}
{{- $mode := $app.mode }}
{{- $service := $app.service }}
{{- $ctx := dict "helm" . "appKey" "alertmanager" "kindOverride" "vmalertmanager" }}
{{- $fullname := include "vm.plain.fullname" $ctx }}
{{- $ns := include "vm.namespace" $ctx }}
{{- if and $app.enabled (not (include "vm.operator.enabled" .)) -}}
---
apiVersion: v1
kind: Service
metadata:
  namespace: {{ $ns }}
  {{- with $service.annotations }}
  annotations: {{ toYaml . | nindent 4 }}
  {{- end }}
  {{- $_ := set $ctx "extraLabels" $app.service.labels }}
  labels: {{ include "vm.labels" $ctx | nindent 4 }}
  {{- $_ := unset $ctx "extraLabels" }}
  name: {{ $fullname }}
spec:
  {{- with $service.trafficDistribution }}
  trafficDistribution: {{ . }}
  {{- end }}
  type: {{ $service.type }}
  {{- /* headless by default with non-legacy naming, as in VictoriaMetrics operator; explicit clusterIP always wins */}}
  {{- $headless := and (kindIs "invalid" $service.clusterIP) (eq $service.type "ClusterIP") (eq (include "vm.useLegacyNaming" $ctx) "false") }}
  {{- $clusterIP := ternary "None" ($service.clusterIP | default "") $headless }}
  {{- with $clusterIP }}
  clusterIP: {{ . }}
  {{- end }}
  {{- if or $service.publishNotReadyAddresses $headless }}
  publishNotReadyAddresses: true
  {{- end }}
  {{- with $service.externalIPs }}
  externalIPs: {{ toYaml . | nindent 4 }}
  {{- end }}
  {{- with $service.loadBalancerIP }}
  loadBalancerIP: {{ . }}
  {{- end }}
  {{- with $service.loadBalancerSourceRanges }}
  loadBalancerSourceRanges: {{ toYaml . | nindent 4 }}
  {{- end }}
  {{- with $service.healthCheckNodePort }}
  healthCheckNodePort: {{ . }}
  {{- end }}
  {{- with $service.externalTrafficPolicy }}
  externalTrafficPolicy: {{ . }}
  {{- end }}
  {{- with $service.ipFamilyPolicy }}
  ipFamilyPolicy: {{ . }}
  {{- end }}
  {{- with $service.ipFamilies }}
  ipFamilies: {{ toYaml . | nindent 4 }}
  {{- end }}
  ports:
    {{- $overrides := $service.portOverrides | default dict }}
    {{- $portName := include "alertmanager.service.portName" $ctx }}
    {{- $override := dig $portName dict $overrides }}
    - name: {{ $portName }}
      port: {{ $override.port | default $service.servicePort }}
      targetPort: {{ $override.targetPort | default "web" }}
      protocol: {{ $override.protocol | default "TCP" }}
      {{- with ($override.nodePort | default $service.nodePort) }}
      nodePort: {{ . }}
      {{- end }}
      {{- with $override.appProtocol }}
      appProtocol: {{ . }}
      {{- end }}
    {{- if gt (int $app.replicaCount) 1 }}
    {{- $meshPort := include "vm.port.from.flag" (dict "flag" $app.cluster.listenAddress "default" "9094") }}
    {{- $tcpOverride := dig "tcp-mesh" dict $overrides }}
    - name: tcp-mesh
      port: {{ $tcpOverride.port | default $meshPort }}
      targetPort: {{ $tcpOverride.targetPort | default "mesh-tcp" }}
      protocol: {{ $tcpOverride.protocol | default "TCP" }}
      {{- with $tcpOverride.nodePort }}
      nodePort: {{ . }}
      {{- end }}
      {{- with $tcpOverride.appProtocol }}
      appProtocol: {{ . }}
      {{- end }}
    {{- $udpOverride := dig "udp-mesh" dict $overrides }}
    - name: udp-mesh
      port: {{ $udpOverride.port | default $meshPort }}
      targetPort: {{ $udpOverride.targetPort | default "mesh-udp" }}
      protocol: {{ $udpOverride.protocol | default "UDP" }}
      {{- with $udpOverride.nodePort }}
      nodePort: {{ . }}
      {{- end }}
      {{- with $udpOverride.appProtocol }}
      appProtocol: {{ . }}
      {{- end }}
    {{- end }}
  selector: {{ include "vm.selectorLabels" $ctx | nindent 4 }}
{{- end }}
