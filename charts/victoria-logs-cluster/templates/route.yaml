{{- $ctx := dict "helm" . }}
{{- range $name, $app := .Values }}
{{- if and (kindIs "map" $app) $app.enabled ($app.route).enabled }}
{{- $route := $app.route }}
{{- $_ := set $ctx "extraLabels" $route.extraLabels }}
{{- $_ := set $ctx "appKey" $name }}
{{- $fullname := include "vm.plain.fullname" $ctx }}
{{- $port := $route.port | default ($app.service.servicePort | default (include "vm.port.from.flag" (dict "flag" (($app.extraArgs | default dict).httpListenAddr | default (include "vm.addr.primary" $app.http))))) }}
{{- $backends := list (dict "name" $fullname "port" $port "matches" $route.matches) }}
{{- if and (eq $name "vmauth") (include "vm.operator.enabled" $) }}
  {{- if and $route.matches (ne (toJson (fromYamlArray (tpl (toYaml $route.matches) $))) (toJson (list (dict "path" (dict "type" "PathPrefix" "value" "/"))))) }}
    {{- fail "`vmauth.route.matches` other than the default `/` prefix is not converted with `operator.enabled: true`; set `vmauth.route.extraRules` instead" }}
  {{- end }}
  {{- $backends = list }}
  {{- range $component := list "vlinsert" "vlselect" }}
    {{- $target := index $.Values $component }}
    {{- if $target.enabled }}
      {{- $targetPort := $target.service.servicePort | default (include "vm.port.from.flag" (dict "flag" (($target.extraArgs | default dict).httpListenAddr | default (include "vm.addr.primary" $target.http)))) }}
      {{- $matches := list (dict "path" (dict "type" "PathPrefix" "value" (printf "/%s" (trimPrefix "vl" $component)))) }}
      {{- $backends = append $backends (dict "name" (include "vm.plain.fullname" (dict "helm" $ "appKey" $component)) "port" $targetPort "matches" $matches) }}
    {{- end }}
  {{- end }}
{{- end }}
---
apiVersion: {{ $route.apiVersion | default "gateway.networking.k8s.io/v1" }}
kind: {{ $route.kind | default "HTTPRoute" }}
metadata:
  name: {{ $fullname }}
  namespace: {{ include "vm.namespace" $ }}
  labels: {{ include "vm.labels" $ctx | nindent 4 }}
  {{- with $route.annotations }}
  annotations: {{ tpl (toYaml .) $ | nindent 4 }}
  {{- end }}
spec:
  {{- with $route.parentRefs }}
  parentRefs: {{ toYaml . | nindent 4 }}
  {{- end }}
  {{- with $route.hostnames }}
  hostnames: {{ tpl (toYaml .) $ | nindent 4 }}
  {{- end }}
  rules:
    {{- with $route.extraRules }}
    {{- tpl (toYaml .) $ | nindent 4 }}
    {{- end }}
    {{- range $backend := $backends }}
    - backendRefs:
        - name: {{ $backend.name }}
          port: {{ $backend.port }}
          group: ''
          kind: Service
          weight: 1
      {{- with $route.filters }}
      filters: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with $backend.matches }}
      matches: {{ tpl (toYaml .) $ | nindent 8 }}
      {{- end }}
    {{- end }}

{{- end }}
{{- end }}
