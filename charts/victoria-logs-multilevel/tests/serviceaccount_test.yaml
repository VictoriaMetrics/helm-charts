suite: service account
templates:
  - serviceaccount.yaml
  - vlselect-server.yaml
  - vmauth-server.yaml
  - vmauth-config.yaml
set:
  storageNodes[0]: http://x:9428
  vmauth.enabled: true
  serviceAccount.create: true
tests:
  - it: renders a templated serviceAccount.name
    set:
      serviceAccount.name: "{{ .Release.Name }}-sa"
    asserts:
      - equal:
          path: metadata.name
          value: RELEASE-NAME-sa
        template: serviceaccount.yaml
      - equal:
          path: spec.template.spec.serviceAccountName
          value: RELEASE-NAME-sa
        template: vlselect-server.yaml
      - equal:
          path: spec.template.spec.serviceAccountName
          value: RELEASE-NAME-sa
        template: vmauth-server.yaml
