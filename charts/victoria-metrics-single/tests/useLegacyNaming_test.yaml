suite: useLegacyNaming tests
set:
  server.ingress.enabled: true
  server.route.enabled: true
  server.service.enabled: true
  server.persistentVolume.enabled: true
  server.serviceMonitor.enabled: true
  podDisruptionBudget.enabled: true
  networkPolicy.enabled: true
  serviceAccount.create: true
  server.mode: deployment
  rbac.create: true
  rbac.namespaced: false
  server.scrape.enabled: true
  server.relabel.enabled: true
templates:
  - ingress.yaml
  - monitor.yaml
  - networkpolicy.yaml
  - pdb.yaml
  - pvc.yaml
  - rbac.yaml
  - relabel-configmap.yaml
  - route.yaml
  - scrape-configmap.yaml
  - server.yaml
  - service.yaml
  - serviceaccount.yaml
tests:
  - it: "resource names (legacy naming, default)"
    asserts:
      - equal:
          path: metadata.name
          value: RELEASE-NAME-victoria-metrics-single-server
        documentSelector:
          path: metadata.name
          value: RELEASE-NAME-victoria-metrics-single-server
        template: ingress.yaml
      - equal:
          path: metadata.name
          value: RELEASE-NAME-victoria-metrics-single-server
        documentSelector:
          path: metadata.name
          value: RELEASE-NAME-victoria-metrics-single-server
        template: monitor.yaml
      - equal:
          path: metadata.name
          value: RELEASE-NAME-victoria-metrics-single-server
        documentSelector:
          path: metadata.name
          value: RELEASE-NAME-victoria-metrics-single-server
        template: networkpolicy.yaml
      - equal:
          path: metadata.name
          value: RELEASE-NAME-victoria-metrics-single-server
        documentSelector:
          path: metadata.name
          value: RELEASE-NAME-victoria-metrics-single-server
        template: pdb.yaml
      - equal:
          path: metadata.name
          value: RELEASE-NAME-victoria-metrics-single-server
        documentSelector:
          path: metadata.name
          value: RELEASE-NAME-victoria-metrics-single-server
        template: pvc.yaml
      - equal:
          path: metadata.name
          value: RELEASE-NAME-victoria-metrics-single-server
        documentSelector:
          path: kind
          value: ClusterRole
        template: rbac.yaml
      - equal:
          path: metadata.name
          value: RELEASE-NAME-victoria-metrics-single-server
        documentSelector:
          path: kind
          value: ClusterRoleBinding
        template: rbac.yaml
      - equal:
          path: metadata.name
          value: RELEASE-NAME-victoria-metrics-single-server-relabelconfig
        documentSelector:
          path: metadata.name
          value: RELEASE-NAME-victoria-metrics-single-server-relabelconfig
        template: relabel-configmap.yaml
      - equal:
          path: metadata.name
          value: RELEASE-NAME-victoria-metrics-single-server
        documentSelector:
          path: metadata.name
          value: RELEASE-NAME-victoria-metrics-single-server
        template: route.yaml
      - equal:
          path: metadata.name
          value: RELEASE-NAME-victoria-metrics-single-server-scrapeconfig
        documentSelector:
          path: metadata.name
          value: RELEASE-NAME-victoria-metrics-single-server-scrapeconfig
        template: scrape-configmap.yaml
      - equal:
          path: metadata.name
          value: RELEASE-NAME-victoria-metrics-single-server
        documentSelector:
          path: metadata.name
          value: RELEASE-NAME-victoria-metrics-single-server
        template: server.yaml
      - equal:
          path: metadata.name
          value: RELEASE-NAME-victoria-metrics-single-server
        documentSelector:
          path: metadata.name
          value: RELEASE-NAME-victoria-metrics-single-server
        template: service.yaml
      - equal:
          path: metadata.name
          value: RELEASE-NAME-victoria-metrics-single-server
        documentSelector:
          path: metadata.name
          value: RELEASE-NAME-victoria-metrics-single-server
        template: serviceaccount.yaml
  - it: "resource names (useLegacyNaming: false)"
    set:
      useLegacyNaming: false
    asserts:
      - equal:
          path: metadata.name
          value: vmsingle-RELEASE-NAME
        documentSelector:
          path: metadata.name
          value: vmsingle-RELEASE-NAME
        template: ingress.yaml
      - equal:
          path: metadata.name
          value: vmsingle-RELEASE-NAME
        documentSelector:
          path: metadata.name
          value: vmsingle-RELEASE-NAME
        template: monitor.yaml
      - equal:
          path: metadata.name
          value: vmsingle-RELEASE-NAME
        documentSelector:
          path: metadata.name
          value: vmsingle-RELEASE-NAME
        template: networkpolicy.yaml
      - equal:
          path: metadata.name
          value: vmsingle-RELEASE-NAME
        documentSelector:
          path: metadata.name
          value: vmsingle-RELEASE-NAME
        template: pdb.yaml
      - equal:
          path: metadata.name
          value: vmsingle-RELEASE-NAME
        documentSelector:
          path: metadata.name
          value: vmsingle-RELEASE-NAME
        template: pvc.yaml
      - equal:
          path: metadata.name
          value: vmsingle-RELEASE-NAME
        documentSelector:
          path: kind
          value: ClusterRole
        template: rbac.yaml
      - equal:
          path: metadata.name
          value: vmsingle-RELEASE-NAME
        documentSelector:
          path: kind
          value: ClusterRoleBinding
        template: rbac.yaml
      - equal:
          path: metadata.name
          value: vmsingle-RELEASE-NAME-relabelconfig
        documentSelector:
          path: metadata.name
          value: vmsingle-RELEASE-NAME-relabelconfig
        template: relabel-configmap.yaml
      - equal:
          path: metadata.name
          value: vmsingle-RELEASE-NAME
        documentSelector:
          path: metadata.name
          value: vmsingle-RELEASE-NAME
        template: route.yaml
      - equal:
          path: metadata.name
          value: vmsingle-RELEASE-NAME-scrapeconfig
        documentSelector:
          path: metadata.name
          value: vmsingle-RELEASE-NAME-scrapeconfig
        template: scrape-configmap.yaml
      - equal:
          path: metadata.name
          value: vmsingle-RELEASE-NAME
        documentSelector:
          path: metadata.name
          value: vmsingle-RELEASE-NAME
        template: server.yaml
      - equal:
          path: metadata.name
          value: vmsingle-RELEASE-NAME
        documentSelector:
          path: metadata.name
          value: vmsingle-RELEASE-NAME
        template: service.yaml
      - equal:
          path: metadata.name
          value: vmsingle-RELEASE-NAME
        documentSelector:
          path: metadata.name
          value: vmsingle-RELEASE-NAME
        template: serviceaccount.yaml
