{{- if and .Values.networkPolicy.enabled (not (include "vm.operator.enabled" .)) }}
{{- $np := .Values.networkPolicy }}
{{- $ctx := dict "helm" . "kindOverride" "vtagent" }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "vm.plain.fullname" $ctx }}
  namespace: {{ include "vm.namespace" $ctx }}
  {{- $_ := set $ctx "extraLabels" $np.labels }}
  labels: {{ include "vm.metaLabels" $ctx | nindent 4 }}
  {{- $_ := unset $ctx "extraLabels" }}
  {{- with $np.annotations }}
  annotations: {{ toYaml . | nindent 4 }}
  {{- end }}
spec:
  podSelector:
    matchLabels: {{ include "vm.selectorLabels" $ctx | nindent 6 }}
  {{- $policyTypes := $np.policyTypes | default list }}
  {{- if empty $policyTypes }}
    {{- if $np.ingress }}{{ $policyTypes = append $policyTypes "Ingress" }}{{ end }}
    {{- if $np.egress }}{{ $policyTypes = append $policyTypes "Egress" }}{{ end }}
  {{- end }}
  {{- with $policyTypes }}
  policyTypes: {{ toYaml . | nindent 4 }}
  {{- end }}
  {{- with $np.ingress }}
  ingress: {{ toYaml . | nindent 4 }}
  {{- end }}
  {{- with $np.egress }}
  egress: {{ toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
