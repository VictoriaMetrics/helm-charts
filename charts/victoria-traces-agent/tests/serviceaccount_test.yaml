suite: service account tests
set:
  remoteWrite[0].url: http://victoria-traces:10428
templates:
  - server.yaml
  - serviceaccount.yaml
tests:
  - it: creates a service account and uses it in the pod by default
    asserts:
      - isKind:
          of: ServiceAccount
        template: serviceaccount.yaml
      - equal:
          path: metadata.name
          value: vtagent-RELEASE-NAME
        template: serviceaccount.yaml
      - equal:
          path: spec.template.spec.serviceAccountName
          value: vtagent-RELEASE-NAME
        template: server.yaml
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: false
        template: server.yaml

  - it: renders annotations and a custom name
    set:
      serviceAccount:
        name: custom-sa
        automountToken: true
        annotations:
          eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/vtagent
    asserts:
      - equal:
          path: metadata.name
          value: custom-sa
        template: serviceaccount.yaml
      - equal:
          path: metadata.annotations["eks.amazonaws.com/role-arn"]
          value: arn:aws:iam::123456789012:role/vtagent
        template: serviceaccount.yaml
      - equal:
          path: spec.template.spec.serviceAccountName
          value: custom-sa
        template: server.yaml
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: true
        template: server.yaml

  - it: uses an existing service account without creating one
    set:
      serviceAccount:
        create: false
        name: existing-sa
    asserts:
      - hasDocuments:
          count: 0
        template: serviceaccount.yaml
      - equal:
          path: spec.template.spec.serviceAccountName
          value: existing-sa
        template: server.yaml

  - it: falls back to the namespace default service account when create is false and name is unset
    set:
      serviceAccount.create: false
    asserts:
      - hasDocuments:
          count: 0
        template: serviceaccount.yaml
      - notExists:
          path: spec.template.spec.serviceAccountName
        template: server.yaml
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: false
        template: server.yaml
