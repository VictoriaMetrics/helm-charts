suite: service tests
set:
  remoteWrite[0].url: http://victoria-traces:10428
templates:
  - service.yaml
tests:
  - it: is always rendered as a headless Service exposing the HTTP listener
    asserts:
      - isKind:
          of: Service
      - equal:
          path: metadata.name
          value: vtagent-RELEASE-NAME
      - equal:
          path: spec.type
          value: ClusterIP
      - equal:
          path: spec.clusterIP
          value: None
      - equal:
          path: spec.ports
          value:
            - name: http
              port: 10429
              protocol: TCP
              targetPort: http

  - it: exposes the OTLP/gRPC listener when enabled
    set:
      otlpGRPC.listenAddr: :4317
    asserts:
      - equal:
          path: spec.ports
          value:
            - name: http
              port: 10429
              protocol: TCP
              targetPort: http
            - name: otlp-grpc
              port: 4317
              protocol: TCP
              targetPort: otlp-grpc

  - it: targets the primary listener by its name
    set:
      http:
        - name: https
          primary: true
          value: :10429
          tls: true
          tlsCertFile: /etc/tls/tls.crt
          tlsKeyFile: /etc/tls/tls.key
    asserts:
      - equal:
          path: spec.ports
          value:
            - name: https
              port: 10429
              protocol: TCP
              targetPort: https

  - it: honours service.servicePort and service.targetPort for the primary listener
    set:
      service.servicePort: 80
      service.targetPort: 9999
    asserts:
      - equal:
          path: spec.ports
          value:
            - name: http
              port: 80
              protocol: TCP
              targetPort: 9999

  - it: renders a regular ClusterIP Service when clusterIP is unset
    set:
      service.clusterIP: ""
    asserts:
      - notExists:
          path: spec.clusterIP

  - it: ignores clusterIP for non-ClusterIP service types
    set:
      service.type: LoadBalancer
    asserts:
      - equal:
          path: spec.type
          value: LoadBalancer
      - notExists:
          path: spec.clusterIP

  - it: renders appProtocol when set
    set:
      service:
        portOverrides:
          http:
            appProtocol: kubernetes.io/h2c
    asserts:
      - equal:
          path: spec.ports
          value:
            - name: http
              port: 10429
              protocol: TCP
              targetPort: http
              appProtocol: kubernetes.io/h2c

  - it: overrides port, protocol, targetPort and nodePort for the primary http port
    set:
      service:
        type: NodePort
        portOverrides:
          http:
            port: 9999
            protocol: UDP
            targetPort: custom-target
            nodePort: 31234
    asserts:
      - equal:
          path: spec.ports
          value:
            - name: http
              port: 9999
              protocol: UDP
              targetPort: custom-target
              nodePort: 31234

  - it: overrides the otlp-grpc port
    set:
      otlpGRPC:
        listenAddr: :4317
      service:
        portOverrides:
          otlp-grpc:
            port: 9999
            appProtocol: grpc
    asserts:
      - equal:
          path: spec.ports[1]
          value:
            name: otlp-grpc
            port: 9999
            protocol: TCP
            targetPort: otlp-grpc
            appProtocol: grpc

  - it: overrides an extraPorts entry
    set:
      service:
        extraPorts:
          - name: grpc
            port: 9000
            targetPort: 9000
        portOverrides:
          grpc:
            port: 9001
            protocol: UDP
            appProtocol: grpc
    asserts:
      - equal:
          path: spec.ports[1]
          value:
            name: grpc
            port: 9001
            protocol: UDP
            targetPort: 9000
            appProtocol: grpc
