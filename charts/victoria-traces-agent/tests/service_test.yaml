suite: service tests
set:
  remoteWrite[0].url: http://victoria-traces:10428
templates:
  - service.yaml
tests:
  - it: is always rendered as a headless Service exposing the HTTP listener
    asserts:
      - isKind:
          of: Service
      - equal:
          path: metadata.name
          value: vtagent-RELEASE-NAME
      - equal:
          path: spec.type
          value: ClusterIP
      - equal:
          path: spec.clusterIP
          value: None
      - equal:
          path: spec.ports
          value:
            - name: http
              port: 10429
              protocol: TCP
              targetPort: http

  - it: exposes the OTLP/gRPC listener when enabled
    set:
      otlpGRPC.listenAddr: :4317
    asserts:
      - equal:
          path: spec.ports
          value:
            - name: http
              port: 10429
              protocol: TCP
              targetPort: http
            - name: otlp-grpc
              port: 4317
              protocol: TCP
              targetPort: otlp-grpc

  - it: targets the primary listener by its name
    set:
      http:
        - name: https
          primary: true
          value: :10429
          tls: true
          tlsCertFile: /etc/tls/tls.crt
          tlsKeyFile: /etc/tls/tls.key
    asserts:
      - equal:
          path: spec.ports
          value:
            - name: https
              port: 10429
              protocol: TCP
              targetPort: https

  - it: honours service.servicePort and service.targetPort for the primary listener
    set:
      service.servicePort: 80
      service.targetPort: 9999
    asserts:
      - equal:
          path: spec.ports
          value:
            - name: http
              port: 80
              protocol: TCP
              targetPort: 9999

  - it: renders a regular ClusterIP Service when clusterIP is unset
    set:
      service.clusterIP: ""
    asserts:
      - notExists:
          path: spec.clusterIP

  - it: ignores clusterIP for non-ClusterIP service types
    set:
      service.type: LoadBalancer
    asserts:
      - equal:
          path: spec.type
          value: LoadBalancer
      - notExists:
          path: spec.clusterIP
