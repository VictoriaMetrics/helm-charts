suite: ServiceAccount
templates:
  - serviceaccount.yaml
tests:
  - it: is rendered by default
    asserts:
      - isKind:
          of: ServiceAccount
      - notExists:
          path: metadata.labels.foo

  - it: is not rendered when create is false
    set:
      serviceAccount.create: false
    asserts:
      - hasDocuments:
          count: 0

  - it: applies extra labels
    set:
      serviceAccount.extraLabels:
        foo: bar
    asserts:
      - equal:
          path: metadata.labels.foo
          value: bar
      - equal:
          path: metadata.labels["app.kubernetes.io/name"]
          value: vtmcp
