suite: useLegacyNaming tests
set:
  vt.entrypoint: http://example.com
  serviceAccount.create: true
  ingress.enabled: true
  route.enabled: true
  horizontalPodAutoscaler.enabled: true
  podDisruptionBudget.enabled: true
  podDisruptionBudget.minAvailable: 1
  networkPolicy.enabled: true
  scrape.enabled: true
templates:
  - deployment.yaml
  - hpa.yaml
  - ingress.yaml
  - networkpolicy.yaml
  - pdb.yaml
  - route.yaml
  - scrape.yaml
  - service.yaml
  - serviceaccount.yaml
tests:
  - it: "resource names (default)"
    asserts:
      - equal:
          path: metadata.name
          value: vtmcp-RELEASE-NAME
        template: deployment.yaml
      - equal:
          path: metadata.name
          value: vtmcp-RELEASE-NAME
        template: hpa.yaml
      - equal:
          path: metadata.name
          value: vtmcp-RELEASE-NAME
        template: ingress.yaml
      - equal:
          path: metadata.name
          value: vtmcp-RELEASE-NAME
        template: networkpolicy.yaml
      - equal:
          path: metadata.name
          value: vtmcp-RELEASE-NAME
        template: pdb.yaml
      - equal:
          path: metadata.name
          value: vtmcp-RELEASE-NAME
        template: route.yaml
      - equal:
          path: metadata.name
          value: vtmcp-RELEASE-NAME
        template: scrape.yaml
      - equal:
          path: metadata.name
          value: vtmcp-RELEASE-NAME
        template: service.yaml
      - equal:
          path: metadata.name
          value: vtmcp-RELEASE-NAME
        template: serviceaccount.yaml
  - it: "fails with useLegacyNaming=true"
    set:
      useLegacyNaming: true
    asserts:
      - failedTemplate:
          errorMessage: "useLegacyNaming: true is not supported by victoria-traces-mcp chart"
        template: deployment.yaml
