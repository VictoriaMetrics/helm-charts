suite: useLegacyNaming tests
set:
  ingress.enabled: true
  service.enabled: true
  networkPolicy.enabled: true
  serviceAccount.create: true
  podDisruptionBudget.enabled: true
  serviceMonitor.enabled: true
  license.key: dummy
  auth.enabled: true
  read.url: http://x
  write.url: http://x
  rateLimiter.enabled: true
  rateLimiter.datasource.url: http://x
  clusterMode: true
templates:
  - configmap.yaml
  - ingress.yaml
  - monitor.yaml
  - networkpolicy.yaml
  - pdb.yaml
  - server.yaml
  - service.yaml
  - serviceaccount.yaml
tests:
  - it: "resource names (legacy naming, default)"
    asserts:
      - equal:
          path: metadata.name
          value: RELEASE-NAME-victoria-metrics-gateway-config
        template: configmap.yaml
      - equal:
          path: spec.template.spec.volumes[0].configMap.name
          value: RELEASE-NAME-victoria-metrics-gateway-config
        template: server.yaml
      - equal:
          path: metadata.name
          value: RELEASE-NAME-victoria-metrics-gateway
        template: ingress.yaml
      - equal:
          path: metadata.name
          value: RELEASE-NAME-victoria-metrics-gateway
        template: monitor.yaml
      - equal:
          path: metadata.name
          value: RELEASE-NAME-victoria-metrics-gateway
        template: networkpolicy.yaml
      - equal:
          path: metadata.name
          value: RELEASE-NAME-victoria-metrics-gateway
        template: pdb.yaml
      - equal:
          path: metadata.name
          value: RELEASE-NAME-victoria-metrics-gateway
        template: server.yaml
      - equal:
          path: metadata.name
          value: RELEASE-NAME-victoria-metrics-gateway
        template: service.yaml
      - equal:
          path: metadata.name
          value: RELEASE-NAME-victoria-metrics-gateway
        template: serviceaccount.yaml
  - it: "resource names (useLegacyNaming: false)"
    set:
      useLegacyNaming: false
    asserts:
      - equal:
          path: metadata.name
          value: vmgateway-RELEASE-NAME-config
        template: configmap.yaml
      - equal:
          path: spec.template.spec.volumes[0].configMap.name
          value: vmgateway-RELEASE-NAME-config
        template: server.yaml
      - equal:
          path: metadata.name
          value: vmgateway-RELEASE-NAME
        template: ingress.yaml
      - equal:
          path: metadata.name
          value: vmgateway-RELEASE-NAME
        template: monitor.yaml
      - equal:
          path: metadata.name
          value: vmgateway-RELEASE-NAME
        template: networkpolicy.yaml
      - equal:
          path: metadata.name
          value: vmgateway-RELEASE-NAME
        template: pdb.yaml
      - equal:
          path: metadata.name
          value: vmgateway-RELEASE-NAME
        template: server.yaml
      - equal:
          path: metadata.name
          value: vmgateway-RELEASE-NAME
        template: service.yaml
      - equal:
          path: metadata.name
          value: vmgateway-RELEASE-NAME
        template: serviceaccount.yaml
