suite: rate limiter config map tests
set:
  license.key: test-key
  read.url: http://vmselect:8481
  write.url: http://vminsert:8480
templates:
  - configmap.yaml
tests:
  - it: is not rendered when rate limiting is disabled
    set:
      rateLimiter.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: renders the rate limiter config
    set:
      clusterMode: true
      rateLimiter:
        enabled: true
        datasource:
          url: http://vmselect:8481
        config:
          limits:
            - type: queries
              value: 1
    asserts:
      - equal:
          path: metadata.name
          value: RELEASE-NAME-victoria-metrics-gateway-config
      - equal:
          path: data["rate-limiter.yml"]
          value: |
            limits:
            - type: queries
              value: 1

  - it: is not rendered when an existing configMap is set
    set:
      clusterMode: true
      rateLimiter.enabled: true
      rateLimiter.datasource.url: http://vmselect:8481
      configMap: my-rate-limits
    asserts:
      - hasDocuments:
          count: 0
