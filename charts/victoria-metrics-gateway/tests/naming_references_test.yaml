suite: naming references tests
set:
  license.key: test-key
  read.url: http://vmselect:8481
  write.url: http://vminsert:8480
  clusterMode: true
  rateLimiter.enabled: true
  rateLimiter.datasource.url: http://vmselect:8481
  ingress.enabled: true
templates:
  - configmap.yaml
  - ingress.yaml
  - server.yaml
  - service.yaml
  - serviceaccount.yaml
tests:
  - it: "references follow resource names (legacy naming, default)"
    asserts:
      - equal:
          path: spec.rules[0].http.paths[0].backend.service.name
          value: RELEASE-NAME-victoria-metrics-gateway
        template: ingress.yaml
      - equal:
          path: spec.template.spec.serviceAccountName
          value: RELEASE-NAME-victoria-metrics-gateway
        template: server.yaml
      - equal:
          path: metadata.name
          value: RELEASE-NAME-victoria-metrics-gateway
        template: service.yaml
      - equal:
          path: metadata.name
          value: RELEASE-NAME-victoria-metrics-gateway
        template: serviceaccount.yaml
      - equal:
          path: metadata.name
          value: RELEASE-NAME-victoria-metrics-gateway-config
        template: configmap.yaml
      - contains:
          path: spec.template.spec.volumes
          content:
            name: config
            configMap:
              name: RELEASE-NAME-victoria-metrics-gateway-config
        template: server.yaml
  - it: "references follow resource names (useLegacyNaming: false)"
    set:
      useLegacyNaming: false
    asserts:
      - equal:
          path: spec.rules[0].http.paths[0].backend.service.name
          value: vmgateway-RELEASE-NAME
        template: ingress.yaml
      - equal:
          path: spec.template.spec.serviceAccountName
          value: vmgateway-RELEASE-NAME
        template: server.yaml
      - equal:
          path: metadata.name
          value: vmgateway-RELEASE-NAME
        template: service.yaml
      - equal:
          path: metadata.name
          value: vmgateway-RELEASE-NAME
        template: serviceaccount.yaml
      - equal:
          path: metadata.name
          value: vmgateway-RELEASE-NAME-config
        template: configmap.yaml
      - contains:
          path: spec.template.spec.volumes
          content:
            name: config
            configMap:
              name: vmgateway-RELEASE-NAME-config
        template: server.yaml
