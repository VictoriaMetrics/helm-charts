suite: server tests
set:
  license.key: test-key
  read.url: http://vmselect:8481
  write.url: http://vminsert:8480
templates:
  - server.yaml
  - configmap.yaml
tests:
  - it: requires an enterprise license
    set:
      license.key: ""
      auth.enabled: true
    asserts:
      - template: server.yaml
        failedTemplate:
          errorPattern: "victoriametrics.com/products/enterprise"

  - it: requires auth or rate limiting to be enabled
    asserts:
      - template: server.yaml
        failedTemplate:
          errorMessage: at least one item in `.auth.enabled` or `.rateLimiter.enabled` must be set to `true`

  - it: requires read.url
    set:
      auth.enabled: true
      read.url: ""
    asserts:
      - template: server.yaml
        failedTemplate:
          errorMessage: please specify read url(`read.url`) for Rate Limiting or/and Access-Control

  - it: requires write.url
    set:
      auth.enabled: true
      write.url: ""
    asserts:
      - template: server.yaml
        failedTemplate:
          errorMessage: please specify write url(`.write.url`) for Rate Limiting or/and Access-Control

  - it: requires a datasource url for rate limiting
    set:
      clusterMode: true
      rateLimiter.enabled: true
    asserts:
      - template: server.yaml
        failedTemplate:
          errorMessage: please specify datasource url (`.rateLimiter.datasource.url`) for Rate Limiting

  - it: requires cluster mode for rate limiting
    set:
      rateLimiter.enabled: true
      rateLimiter.datasource.url: http://vmselect:8481
    asserts:
      - template: server.yaml
        failedTemplate:
          errorMessage: ratelimiting works only with cluster, please enable `.clusterMode`

  - it: renders default args and port with access control enabled
    set:
      auth.enabled: true
    asserts:
      - template: server.yaml
        isKind:
          of: Deployment
      - template: server.yaml
        equal:
          path: metadata.name
          value: RELEASE-NAME-victoria-metrics-gateway
      - template: server.yaml
        equal:
          path: spec.template.spec.containers[0].name
          value: vmgateway
      - template: server.yaml
        equal:
          path: spec.template.spec.containers[0].args
          value:
            - --clusterMode=false
            - --enable.auth
            - --envflag.enable
            - --envflag.prefix=VM_
            - --httpListenAddr=:8431
            - --license=test-key
            - --loggerFormat=json
            - --read.url=http://vmselect:8481
            - --write.url=http://vminsert:8480
      - template: server.yaml
        equal:
          path: spec.template.spec.containers[0].ports
          value:
            - name: http
              containerPort: 8431
      - template: server.yaml
        equal:
          path: spec.template.spec.serviceAccountName
          value: RELEASE-NAME-victoria-metrics-gateway

  - it: configures rate limiting with the generated config map
    set:
      clusterMode: true
      rateLimiter.enabled: true
      rateLimiter.datasource.url: http://vmselect:8481
    asserts:
      - template: server.yaml
        contains:
          path: spec.template.spec.containers[0].args
          content: --enable.rateLimit
      - template: server.yaml
        contains:
          path: spec.template.spec.containers[0].args
          content: --ratelimit.config=/config/rate-limiter.yml
      - template: server.yaml
        contains:
          path: spec.template.spec.containers[0].args
          content: --datasource.url=http://vmselect:8481
      - template: server.yaml
        contains:
          path: spec.template.spec.containers[0].args
          content: --clusterMode
      - template: server.yaml
        contains:
          path: spec.template.spec.volumes
          content:
            name: config
            configMap:
              name: RELEASE-NAME-victoria-metrics-gateway-config

  - it: mounts an existing config map when configMap is set
    set:
      clusterMode: true
      rateLimiter.enabled: true
      rateLimiter.datasource.url: http://vmselect:8481
      configMap: my-rate-limits
    asserts:
      - template: server.yaml
        contains:
          path: spec.template.spec.volumes
          content:
            name: config
            configMap:
              name: my-rate-limits

  - it: rejects the deprecated rateLimiter.enable value
    set:
      auth.enabled: true
      rateLimiter.enable: true
    asserts:
      - template: server.yaml
        failedTemplate:
          errorMessage: "`rateLimiter.enable` is deprecated. Use `rateLimiter.enabled` instead"
