suite: config secret tests
templates:
  - secret.yaml
tests:
  - it: renders config as auth.yml
    set:
      config:
        users:
          - username: user
            password: pass
            url_prefix: http://vmselect:8481
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: RELEASE-NAME-victoria-metrics-auth
      - equal:
          path: data["auth.yml"]
          decodeBase64: true
          value: |-
            users:
            - password: pass
              url_prefix: http://vmselect:8481
              username: user

  - it: configRaw takes precedence and is templated
    set:
      config:
        users: []
      configRaw: |
        # comment
        unauthorized_user:
          url_prefix: http://{{ .Release.Name }}-vmselect:8481
    asserts:
      - equal:
          path: data["auth.yml"]
          decodeBase64: true
          value: |
            # comment
            unauthorized_user:
              url_prefix: http://RELEASE-NAME-vmselect:8481

  - it: renders configAnnotations
    set:
      configAnnotations:
        note: hi
    asserts:
      - equal:
          path: metadata.annotations.note
          value: hi

  - it: is not rendered when an existing secretName is set
    set:
      secretName: my-auth-config
    asserts:
      - hasDocuments:
          count: 0
