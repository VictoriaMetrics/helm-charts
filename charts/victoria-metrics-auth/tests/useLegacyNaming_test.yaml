suite: useLegacyNaming tests
set:
  ingress.enabled: true
  route.enabled: true
  podDisruptionBudget.enabled: true
  networkPolicy.enabled: true
  serviceAccount.create: true
  serviceMonitor.enabled: true
templates:
  - ingress.yaml
  - monitor.yaml
  - networkpolicy.yaml
  - pdb.yaml
  - route.yaml
  - secret.yaml
  - server.yaml
  - service.yaml
  - serviceaccount.yaml
tests:
  - it: "resource names (legacy naming, default)"
    asserts:
      - equal:
          path: metadata.name
          value: RELEASE-NAME-victoria-metrics-auth
        template: ingress.yaml
      - equal:
          path: metadata.name
          value: RELEASE-NAME-victoria-metrics-auth
        template: monitor.yaml
      - equal:
          path: metadata.name
          value: RELEASE-NAME-victoria-metrics-auth
        template: networkpolicy.yaml
      - equal:
          path: metadata.name
          value: RELEASE-NAME-victoria-metrics-auth
        template: pdb.yaml
      - equal:
          path: metadata.name
          value: RELEASE-NAME-victoria-metrics-auth
        template: route.yaml
      - equal:
          path: metadata.name
          value: RELEASE-NAME-victoria-metrics-auth
        template: secret.yaml
      - equal:
          path: metadata.name
          value: RELEASE-NAME-victoria-metrics-auth
        template: server.yaml
      - equal:
          path: metadata.name
          value: RELEASE-NAME-victoria-metrics-auth
        template: service.yaml
      - equal:
          path: metadata.name
          value: RELEASE-NAME-victoria-metrics-auth
        template: serviceaccount.yaml
  - it: "resource names (useLegacyNaming: false)"
    set:
      useLegacyNaming: false
    asserts:
      - equal:
          path: metadata.name
          value: vmauth-RELEASE-NAME
        template: ingress.yaml
      - equal:
          path: metadata.name
          value: vmauth-RELEASE-NAME
        template: monitor.yaml
      - equal:
          path: metadata.name
          value: vmauth-RELEASE-NAME
        template: networkpolicy.yaml
      - equal:
          path: metadata.name
          value: vmauth-RELEASE-NAME
        template: pdb.yaml
      - equal:
          path: metadata.name
          value: vmauth-RELEASE-NAME
        template: route.yaml
      - equal:
          path: metadata.name
          value: vmauth-RELEASE-NAME
        template: secret.yaml
      - equal:
          path: metadata.name
          value: vmauth-RELEASE-NAME
        template: server.yaml
      - equal:
          path: metadata.name
          value: vmauth-RELEASE-NAME
        template: service.yaml
      - equal:
          path: metadata.name
          value: vmauth-RELEASE-NAME
        template: serviceaccount.yaml
