suite: vmselect volume naming tests
set:
  vmselect.mode: statefulSet
  vmselect.persistentVolume.enabled: true
templates:
  - vmselect-server.yaml
tests:
  - it: uses the legacy volume name by default
    asserts:
      - equal:
          path: spec.volumeClaimTemplates[0].metadata.name
          value: cache-volume
      - exists:
          path: spec.template.spec.containers[0].volumeMounts[?(@.name == "cache-volume")]

  - it: "uses the operator volume name with useLegacyNaming: false"
    set:
      useLegacyNaming: false
    asserts:
      - equal:
          path: spec.volumeClaimTemplates[0].metadata.name
          value: vmselect-cachedir
      - exists:
          path: spec.template.spec.containers[0].volumeMounts[?(@.name == "vmselect-cachedir")]

  - it: an explicit volume name is used for both the claim template and the mount
    set:
      vmselect.persistentVolume.name: custom-volume
      useLegacyNaming: false
    asserts:
      - equal:
          path: spec.volumeClaimTemplates[0].metadata.name
          value: custom-volume
      - exists:
          path: spec.template.spec.containers[0].volumeMounts[?(@.name == "custom-volume")]
