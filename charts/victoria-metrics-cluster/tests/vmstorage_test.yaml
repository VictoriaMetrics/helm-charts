suite: vmstorage templates test
chart:
  version: 0.1.1
  appVersion: 0.1.0
templates:
  - vmstorage-server.yaml
tests:
  - it: statefulset should match snapshot
    asserts:
      - matchSnapshot: {}
  - it: statefulset should match snapshot with fullnameOverride, extraLabels and podLabels
    set:
      vmstorage:
        name: storage
        fullnameOverride: vmstorage-node
        extraLabels:
          extraLabelName: extraLabelValue
        podLabels:
          podLabelName: podLabelValue
    asserts:
      - matchSnapshot: {}
  - it: should render custom command
    set:
      vmstorage:
        command:
          - /custom/bin/vmstorage
    asserts:
      - equal:
          path: spec.template.spec.containers[0].command
          value:
            - /custom/bin/vmstorage

  - it: should set GOMEMLIMIT to 85 percent of the memory limit
    set:
      vmstorage:
        useGOMEMLIMIT: true
        resources:
          limits:
            memory: 80Gi
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GOMEMLIMIT
            value: 69632MiB

  - it: should use the common memory limit when vmstorage has no component limit
    set:
      common:
        resources:
          limits:
            memory: 10Gi
      vmstorage:
        useGOMEMLIMIT: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GOMEMLIMIT
            value: 8704MiB

  - it: should calculate a decimal quantity exactly at a MiB boundary
    set:
      vmstorage:
        useGOMEMLIMIT: true
        resources:
          limits:
            memory: 5103197671.757G
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GOMEMLIMIT
            value: 4136770268434MiB

  - it: should scale large mantissas before the int64 range check
    set:
      vmstorage:
        useGOMEMLIMIT: true
        resources:
          limits:
            memory: "10000000000000000000m"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GOMEMLIMIT
            value: 8106231689MiB

  - it: should preserve an explicit GOMEMLIMIT
    set:
      vmstorage:
        useGOMEMLIMIT: true
        resources:
          limits:
            memory: 80Gi
        env:
          - name: GOMEMLIMIT
            value: 123MiB
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GOMEMLIMIT
            value: 123MiB
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: GOMEMLIMIT
            value: 69632MiB

  - it: should not set GOMEMLIMIT by default
    set:
      vmstorage:
        resources:
          limits:
            memory: 80Gi
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].env

  - it: should not set GOMEMLIMIT when enabled without a memory limit
    set:
      vmstorage:
        useGOMEMLIMIT: true
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].env

  - it: should not set GOMEMLIMIT when disabled
    set:
      vmstorage:
        useGOMEMLIMIT: false
        resources:
          limits:
            memory: 80Gi
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].env

  - it: should not override values that may be supplied through envFrom
    set:
      vmstorage:
        useGOMEMLIMIT: true
        resources:
          limits:
            memory: 80Gi
        envFrom:
          - configMapRef:
              name: app-env
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].env

  - it: should fail when the memory quantity is invalid
    set:
      vmstorage:
        useGOMEMLIMIT: true
        resources:
          limits:
            memory: 1foo
    asserts:
      - failedTemplate:
          errorMessage: 'invalid memory quantity "1foo" for automatic GOMEMLIMIT'
        template: vmstorage-server.yaml

  - it: should fail when GOMEMLIMIT would be less than 1MiB
    set:
      vmstorage:
        useGOMEMLIMIT: true
        resources:
          limits:
            memory: 1Mi
    asserts:
      - failedTemplate:
          errorMessage: '85% of memory quantity "1Mi" is less than 1MiB; automatic GOMEMLIMIT must be at least 1MiB'
        template: vmstorage-server.yaml

  - it: should use the configured percentage
    set:
      vmstorage:
        useGOMEMLIMIT: true
        goMemLimitPercent: 70
        resources:
          limits:
            memory: 80Gi
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GOMEMLIMIT
            value: 57344MiB

  - it: should accept a GOMEMLIMIT percentage of 100
    set:
      vmstorage:
        useGOMEMLIMIT: true
        goMemLimitPercent: 100
        resources:
          limits:
            memory: 80Gi
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GOMEMLIMIT
            value: 81920MiB

  - it: should round fractional bytes up like Kubernetes
    set:
      vmstorage:
        useGOMEMLIMIT: true
        goMemLimitPercent: 100
        resources:
          limits:
            memory: "1048575.9999"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GOMEMLIMIT
            value: 1MiB

  - it: should reject a GOMEMLIMIT percentage above 100
    set:
      vmstorage:
        useGOMEMLIMIT: true
        goMemLimitPercent: 101
        resources:
          limits:
            memory: 80Gi
    asserts:
      - failedTemplate:
          errorMessage: 'goMemLimitPercent must be an integer between 1 and 100, got "101"'
        template: vmstorage-server.yaml

  - it: should reject a zero GOMEMLIMIT percentage
    set:
      vmstorage:
        useGOMEMLIMIT: true
        goMemLimitPercent: 0
        resources:
          limits:
            memory: 80Gi
    asserts:
      - failedTemplate:
          errorMessage: 'goMemLimitPercent must be an integer between 1 and 100, got "0"'
        template: vmstorage-server.yaml

  - it: should reject fractional GOMEMLIMIT percentages
    set:
      vmstorage:
        useGOMEMLIMIT: true
        goMemLimitPercent: 85.5
        resources:
          limits:
            memory: 80Gi
    asserts:
      - failedTemplate:
          errorMessage: 'goMemLimitPercent must be an integer between 1 and 100, got "85.5"'
        template: vmstorage-server.yaml
