suite: labels and selectors
set:
  serviceAccount.create: true
  vmauth.enabled: true
  vmauth.horizontalPodAutoscaler.enabled: true
  vmauth.ingress.enabled: true
  vmauth.networkPolicy.enabled: true
  vmauth.podDisruptionBudget.enabled: true
  vmauth.route.enabled: true
  vmauth.service.enabled: true
  vmauth.serviceMonitor.enabled: true
  vminsert.enabled: true
  vminsert.horizontalPodAutoscaler.enabled: true
  vminsert.ingress.enabled: true
  vminsert.networkPolicy.enabled: true
  vminsert.podDisruptionBudget.enabled: true
  vminsert.route.enabled: true
  vminsert.service.enabled: true
  vminsert.serviceMonitor.enabled: true
  vmselect.enabled: true
  vmselect.horizontalPodAutoscaler.enabled: true
  vmselect.ingress.enabled: true
  vmselect.networkPolicy.enabled: true
  vmselect.podDisruptionBudget.enabled: true
  vmselect.route.enabled: true
  vmselect.service.enabled: true
  vmselect.serviceMonitor.enabled: true
  vmstorage.enabled: true
  vmstorage.horizontalPodAutoscaler.enabled: true
  vmstorage.ingress.enabled: true
  vmstorage.networkPolicy.enabled: true
  vmstorage.podDisruptionBudget.enabled: true
  vmstorage.route.enabled: true
  vmstorage.service.enabled: true
  vmstorage.serviceMonitor.enabled: true
capabilities:
  apiVersions:
    - operator.victoriametrics.com/v1beta1
    - monitoring.coreos.com/v1
    - gateway.networking.k8s.io/v1
    - autoscaling.k8s.io/v1
templates:
  - monitor.yaml
  - networkpolicy.yaml
  - pdb.yaml
  - service.yaml
  - vmauth-server.yaml
  - vminsert-server.yaml
  - vmselect-server.yaml
  - vmstorage-server.yaml
  - hpa.yaml
  - ingress.yaml
  - route.yaml
  - serviceaccount.yaml
  - vmauth-config.yaml
tests:
  - it: "selectors match pod labels with operator naming"
    set:
      useLegacyNaming: false
    asserts:
      - equal:
          path: spec.podSelector.matchLabels
          value:
            app.kubernetes.io/component: monitoring
            app.kubernetes.io/instance: RELEASE-NAME
            app.kubernetes.io/name: vmauth
        template: networkpolicy.yaml
        documentSelector:
          path: metadata.name
          value: vmauth-RELEASE-NAME
      - equal:
          path: spec.podSelector.matchLabels
          value:
            app.kubernetes.io/component: monitoring
            app.kubernetes.io/instance: RELEASE-NAME
            app.kubernetes.io/name: vminsert
        template: networkpolicy.yaml
        documentSelector:
