suite: vminsert templates test
chart:
  version: 0.1.1
  appVersion: 0.1.0
templates:
  - vminsert-server.yaml
  - relabel-configmap.yaml
tests:
  - it: deployment should match snapshot
    asserts:
      - matchSnapshot: {}
        template: vminsert-server.yaml
  - it: deployment should match snapshot with fullnameOverride, extraLabels and podLabels
    set:
      vminsert:
        name: insert
        fullnameOverride: vminsert-node
        extraLabels:
          extraLabelName: extraLabelValue
        podLabels:
          podLabelName: podLabelValue
    asserts:
      - matchSnapshot: {}
        template: vminsert-server.yaml
  - it: should render custom command
    set:
      vminsert:
        command:
          - /custom/bin/vminsert
    asserts:
      - template: vminsert-server.yaml
        equal:
          path: spec.template.spec.containers[0].command
          value:
            - /custom/bin/vminsert
  - it: should apply global.extraLabels to resource metadata and pod template
    set:
      global:
        extraLabels:
          team: platform
    asserts:
      - template: vminsert-server.yaml
        equal:
          path: metadata.labels.team
          value: platform
      - template: vminsert-server.yaml
        equal:
          path: spec.template.metadata.labels.team
          value: platform
  - it: should apply global.extraAnnotations to resource metadata and pod template
    set:
      global:
        extraAnnotations:
          owner: platform-team
    asserts:
      - template: vminsert-server.yaml
        equal:
          path: metadata.annotations.owner
          value: platform-team
      - template: vminsert-server.yaml
        equal:
          path: spec.template.metadata.annotations.owner
          value: platform-team
  - it: should render checksum for chart-managed relabel config overriding podAnnotations
    set:
      vminsert:
        podAnnotations:
          checksum/config: custom
        relabel:
          enabled: true
    asserts:
      - template: vminsert-server.yaml
        exists:
          path: spec.template.metadata.annotations["checksum/config"]
      - template: vminsert-server.yaml
        notEqual:
          path: spec.template.metadata.annotations["checksum/config"]
          value: custom
  - it: should not render checksum with external relabel configmap
    set:
      vminsert:
        relabel:
          enabled: true
          configMap: external
    asserts:
      - template: vminsert-server.yaml
        notExists:
          path: spec.template.metadata.annotations["checksum/config"]
