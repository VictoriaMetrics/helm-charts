suite: service templates test
chart:
  version: 0.1.1
  appVersion: 0.1.0
templates:
  - service.yaml
tests:
  - it: service should match snapshot
    set:
      vmauth:
        enabled: true
    asserts:
      - matchSnapshot: {}
  - it: service should match snapshot with fullnameOverride and extraLabels
    set:
      vminsert:
        name: insert
        fullnameOverride: vminsert-node
        extraLabels:
          extraLabelName: insertExtraLabelValue
        service:
          labels:
            extraServiceLabelName: insertExtraServiceLabelValue
      vmauth:
        enabled: true
        name: auth
        fullnameOverride: vmauth-node
        extraLabels:
          extraLabelName: authExtraLabelValue
        service:
          labels:
            extraServiceLabelName: authExtraServiceLabelValue
      vmselect:
        name: select
        fullnameOverride: vmselect-node
        extraLabels:
          extraLabelName: selectExtraLabelValue
        service:
          labels:
            extraServiceLabelName: selectExtraServiceLabelValue
      vmstorage:
        name: storage
        fullnameOverride: vmstorage-node
        extraLabels:
          extraLabelName: storageExtraLabelValue
        service:
          labels:
            extraServiceLabelName: storageExtraServiceLabelValue
    asserts:
      - matchSnapshot: {}
  - it: should render nodePort for vmselect service
    set:
      vmselect:
        service:
          type: NodePort
          nodePort: 30481
    asserts:
      - equal:
          path: spec.type
          value: NodePort
        documentIndex: 1
      - equal:
          path: spec.ports[0].nodePort
          value: 30481
        documentIndex: 1
  - it: should render nodePort for vminsert service
    set:
      vminsert:
        service:
          type: NodePort
          nodePort: 30480
    asserts:
      - equal:
          path: spec.type
          value: NodePort
        documentIndex: 0
      - equal:
          path: spec.ports[0].nodePort
          value: 30480
        documentIndex: 0
  - it: should render nodePort for vmstorage service
    set:
      vmstorage:
        service:
          type: NodePort
          nodePort: 30482
    asserts:
      - equal:
          path: spec.type
          value: NodePort
        documentIndex: 2
      - equal:
          path: spec.ports[0].nodePort
          value: 30482
        documentIndex: 2
  - it: should not render appProtocol by default
    asserts:
      - notExists:
          path: spec.ports[0].appProtocol
        documentIndex: 0
      - notExists:
          path: spec.ports[0].appProtocol
        documentIndex: 1
      - notExists:
          path: spec.ports[0].appProtocol
        documentIndex: 2
  - it: should render appProtocol for the primary http port
    set:
      vmselect:
        service:
          portOverrides:
            http:
              appProtocol: kubernetes.io/h2c
    asserts:
      - equal:
          path: spec.ports[0].appProtocol
          value: kubernetes.io/h2c
        documentIndex: 1
  - it: should render appProtocol for an extraPorts entry
    set:
      vminsert:
        service:
          extraPorts:
            - name: grpc
              port: 9000
              targetPort: 9000
          portOverrides:
            grpc:
              appProtocol: grpc
    asserts:
      - equal:
          path: spec.ports[1].appProtocol
          value: grpc
        documentIndex: 0
  - it: should override the clusternative port on vmselect
    set:
      vmselect:
        extraArgs:
          clusternativeListenAddr: :8400
        service:
          portOverrides:
            clusternative:
              port: 9999
              appProtocol: kubernetes.io/h2c
    asserts:
      - equal:
          path: spec.ports[1]
          value:
            name: clusternative
            protocol: TCP
            port: 9999
            targetPort: clusternative
            appProtocol: kubernetes.io/h2c
        documentIndex: 1
  - it: should override the fixed vmselect and vminsert ports on vmstorage
    set:
      vmstorage:
        service:
          portOverrides:
            vmselect:
              port: 9998
              appProtocol: kubernetes.io/h2c
            vminsert:
              port: 9997
    asserts:
      - equal:
          path: spec.ports[1]
          value:
            name: vmselect
            port: 9998
            targetPort: vmselect
            protocol: TCP
            appProtocol: kubernetes.io/h2c
        documentIndex: 2
      - equal:
          path: spec.ports[2].port
          value: 9997
        documentIndex: 2
  - it: should override port, protocol, targetPort and nodePort for the primary http port
    set:
      vmselect:
        service:
          type: NodePort
          portOverrides:
            http:
              port: 9999
              protocol: UDP
              targetPort: custom-target
              nodePort: 31234
    asserts:
      - equal:
          path: spec.ports[0]
          value:
            name: http
            port: 9999
            protocol: UDP
            targetPort: custom-target
            nodePort: 31234
        documentIndex: 1
