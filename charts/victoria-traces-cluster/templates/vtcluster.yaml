{{- if include "vm.operator.enabled" . }}
{{- $Values := .Values }}
{{- $ctx := dict
    "helm" .
    "kindOverride" "vtcluster"
}}
{{- $spec := fromYaml (include "vm.operator.resource.spec" (dict "helm" .)) }}
{{- $storage := $Values.vtstorage }}
{{- if $storage.enabled }}
  {{- $componentSpec := include "vm.operator.cluster.component" (dict
      "helm" .
      "appKey" "vtstorage"
      "kindOverride" "vtstorage"
      "app" $storage
      "scrape" $storage.vmServiceScrape
      "scrapePath" "vtstorage.vmServiceScrape"
  ) }}
  {{- $component := fromYaml $componentSpec }}
  {{- $extraArgs := $component.extraArgs | default dict }}
  {{- with $storage.retentionPeriod }}
    {{- $_ := set $component "retentionPeriod" (toString .) }}
  {{- end }}
  {{- with $storage.retentionDiskSpaceUsage }}
    {{- $_ := set $component "retentionMaxDiskSpaceUsageBytes" (ternary (printf "%dGiB" (int .)) (toString .) (gt (int .) 0)) }}
  {{- end }}
  {{- with $storage.retentionMaxDiskUsagePercent }}
    {{- $_ := set $extraArgs "retention.maxDiskUsagePercent" (toString .) }}
    {{- $_ := set $component "extraArgs" $extraArgs }}
  {{- end }}
  {{- $pvc := $storage.persistentVolume }}
  {{- if and $pvc.enabled $pvc.existingClaim }}
    {{- $_ := set $component "storageDataPath" $pvc.mountPath }}
    {{- $volume := dict
        "name" "vtstorage-db"
        "persistentVolumeClaim" (dict "claimName" (tpl $pvc.existingClaim .))
    }}
    {{- $_ := set $component "volumes" (append ($component.volumes | default list) $volume) }}
  {{- else if $pvc.enabled }}
    {{- $volumeNameCtx := dict
        "helm" .
        "appKey" "vtstorage"
    }}
    {{- $claimName := $pvc.name | default (include "vtstorage.volume.name" $volumeNameCtx) }}
    {{- $template := dict
        "metadata" (dict "name" $claimName)
        "spec" (fromYaml (include "vm.operator.storage" (dict "persistentVolume" $pvc)))
    }}
    {{- $_ := set $component "storage" (dict "volumeClaimTemplate" $template) }}
  {{- end }}
  {{- $_ := set $spec "storage" $component }}
{{- end }}
{{- $components := dict
    "vtselect" "select"
    "vtinsert" "insert"
}}
{{- range $name, $key := $components }}
  {{- $app := index $Values $name }}
  {{- if $app.enabled }}
    {{- with $app.excludeStorageIDs }}
      {{- if (index $spec "storage") }}
        {{- $ids := list }}
        {{- range . }}
          {{- $ids = append $ids (int .) }}
        {{- end }}
        {{- $_ := set (index $spec "storage") (ternary "maintenanceInsertNodeIDs" "maintenanceSelectNodeIDs" (hasSuffix "insert" $name)) $ids }}
      {{- end }}
    {{- end }}
    {{- $componentSpec := include "vm.operator.cluster.component" (dict
        "helm" $
        "appKey" $name
        "kindOverride" $name
        "app" $app
        "scrape" $app.vmServiceScrape
        "scrapePath" (printf "%s.vmServiceScrape" $name)
    ) }}
    {{- $component := fromYaml $componentSpec }}
    {{- if eq $name "vtinsert" }}
    {{- end }}
    {{- $_ := set $spec $key $component }}
  {{- end }}
{{- end }}
{{- $auth := $Values.vmauth }}
{{- if $auth.enabled }}
  {{- if or $auth.config $auth.configSecretName }}
    {{- fail "`vmauth.config` and `vmauth.configSecretName` are not converted with `operator.enabled: true`; the operator load balancer generates its own routing config, customize it in `operator.spec.requestsLoadBalancer`" }}
  {{- end }}
  {{- if ($auth.verticalPodAutoscaler).enabled }}
    {{- fail "`vmauth.verticalPodAutoscaler` is not supported by the operator load balancer with `operator.enabled: true`" }}
  {{- end }}
  {{- $lbSpec := include "vm.operator.cluster.component" (dict
      "helm" .
      "appKey" "vmauth"
      "kindOverride" "vmauth"
      "app" $auth
      "scrape" $auth.vmServiceScrape
      "scrapePath" "vmauth.vmServiceScrape"
  ) }}
  {{- $lb := fromYaml $lbSpec }}
  {{- $requestsLoadBalancer := dict
      "enabled" true
      "spec" $lb
  }}
  {{- $_ := set $spec "requestsLoadBalancer" $requestsLoadBalancer }}
{{- end }}
{{- $crSpec := dict
    "helm" .
    "spec" $spec
}}
---
apiVersion: operator.victoriametrics.com/v1
kind: VTCluster
metadata:
  name: {{ include "vm.operator.cr.name" $ctx }}
  namespace: {{ include "vm.namespace" $ctx }}
  labels: {{ include "vm.operator.cr.labels" $ctx | nindent 4 }}
  {{- with .Values.operator.annotations }}
  annotations: {{ toYaml . | nindent 4 }}
  {{- end }}
spec: {{ include "vm.operator.cr.spec" $crSpec | nindent 2 }}
{{- end }}
