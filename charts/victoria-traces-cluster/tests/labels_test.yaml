suite: labels and selectors
set:
  serviceAccount.create: true
  vmauth.enabled: true
  vmauth.horizontalPodAutoscaler.enabled: true
  vmauth.ingress.enabled: true
  vmauth.networkPolicy.enabled: true
  vmauth.podDisruptionBudget.enabled: true
  vmauth.route.enabled: true
  vmauth.service.enabled: true
  vmauth.vmServiceScrape.enabled: true
  vtinsert.enabled: true
  vtinsert.horizontalPodAutoscaler.enabled: true
  vtinsert.ingress.enabled: true
  vtinsert.networkPolicy.enabled: true
  vtinsert.podDisruptionBudget.enabled: true
  vtinsert.route.enabled: true
  vtinsert.service.enabled: true
  vtinsert.vmServiceScrape.enabled: true
  vtselect.enabled: true
  vtselect.horizontalPodAutoscaler.enabled: true
  vtselect.ingress.enabled: true
  vtselect.networkPolicy.enabled: true
  vtselect.podDisruptionBudget.enabled: true
  vtselect.route.enabled: true
  vtselect.service.enabled: true
  vtselect.vmServiceScrape.enabled: true
  vtstorage.enabled: true
  vtstorage.horizontalPodAutoscaler.enabled: true
  vtstorage.ingress.enabled: true
  vtstorage.networkPolicy.enabled: true
  vtstorage.podDisruptionBudget.enabled: true
  vtstorage.route.enabled: true
  vtstorage.service.enabled: true
  vtstorage.vmServiceScrape.enabled: true
capabilities:
  apiVersions:
    - operator.victoriametrics.com/v1beta1
    - monitoring.coreos.com/v1
    - gateway.networking.k8s.io/v1
    - autoscaling.k8s.io/v1
templates:
  - networkpolicy.yaml
  - pdb.yaml
  - service.yaml
  - vmServiceScrape.yaml
  - vmauth-server.yaml
  - vtinsert-server.yaml
  - vtselect-server.yaml
  - vtstorage-server.yaml
  - hpa.yaml
  - ingress.yaml
  - route.yaml
  - serviceaccount.yaml
  - vmauth-config.yaml
tests:
  - it: "selectors match pod labels with operator naming"
    set:
      useLegacyNaming: false
    asserts:
      - equal:
          path: spec.podSelector.matchLabels
          value:
            app.kubernetes.io/component: monitoring
            app.kubernetes.io/instance: RELEASE-NAME
            app.kubernetes.io/name: vmauth
        template: networkpolicy.yaml
        documentSelector:
          path: metadata.name
          value: vmauth-RELEASE-NAME
      - equal:
          path: spec.podSelector.matchLabels
          value:
            app.kubernetes.io/component: monitoring
            app.kubernetes.io/instance: RELEASE-NAME
            app.kubernetes.io/name: vtinsert
        template: networkpolicy.yaml
        documentSelector:
          path: metadata.name
          value: vtinsert-RELEASE-NAME
      - equal:
          path: spec.podSelector.matchLabels
          value:
            app.kubernetes.io/component: monitoring
            app.kubernetes.io/instance: RELEASE-NAME
