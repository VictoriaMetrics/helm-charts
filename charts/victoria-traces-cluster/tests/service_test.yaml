suite: service templates test
chart:
  version: 0.1.1
  appVersion: 0.1.0
templates:
  - service.yaml
tests:
  - it: service should match snapshot
    set:
      vmauth:
        enabled: true
        image:
          tag: v1.116.0
    asserts:
      - matchSnapshot: {}
  - it: service should match snapshot with fullnameOverride and extraLabels
    set:
      vminsert:
        name: insert
        fullnameOverride: vminsert-node
        extraLabels:
          extraLabelName: insertExtraLabelValue
        service:
          labels:
            extraServiceLabelName: insertExtraServiceLabelValue
      vmauth:
        enabled: true
        image:
          tag: v1.116.0
        name: auth
        fullnameOverride: vmauth-node
        extraLabels:
          extraLabelName: authExtraLabelValue
        service:
          labels:
            extraServiceLabelName: authExtraServiceLabelValue
      vmselect:
        name: select
        fullnameOverride: vmselect-node
        extraLabels:
          extraLabelName: selectExtraLabelValue
        service:
          labels:
            extraServiceLabelName: selectExtraServiceLabelValue
      vmstorage:
        name: storage
        fullnameOverride: vmstorage-node
        extraLabels:
          extraLabelName: storageExtraLabelValue
        service:
          labels:
            extraServiceLabelName: storageExtraServiceLabelValue
    asserts:
      - matchSnapshot: {}
  - it: should render nodePort for vtselect service
    set:
      vtselect:
        service:
          type: NodePort
          nodePort: 30471
    asserts:
      - equal:
          path: spec.type
          value: NodePort
        documentIndex: 1
      - equal:
          path: spec.ports[0].nodePort
          value: 30471
        documentIndex: 1
  - it: should render nodePort for vtinsert service
    set:
      vtinsert:
        service:
          type: NodePort
          nodePort: 30481
    asserts:
      - equal:
          path: spec.type
          value: NodePort
        documentIndex: 0
      - equal:
          path: spec.ports[0].nodePort
          value: 30481
        documentIndex: 0
  - it: should not render appProtocol by default
    asserts:
      - notExists:
          path: spec.ports[0].appProtocol
        documentIndex: 0
      - notExists:
          path: spec.ports[0].appProtocol
        documentIndex: 1
  - it: should render appProtocol for the primary http port
    set:
      vtselect:
        service:
          portOverrides:
            http:
              appProtocol: kubernetes.io/h2c
    asserts:
      - equal:
          path: spec.ports[0].appProtocol
          value: kubernetes.io/h2c
        documentIndex: 1
  - it: should render appProtocol for an extraPorts entry
    set:
      vtinsert:
        service:
          extraPorts:
            - name: grpc
              port: 9000
              targetPort: 9000
          portOverrides:
            grpc:
              appProtocol: grpc
    asserts:
      - equal:
          path: spec.ports[1].appProtocol
          value: grpc
        documentIndex: 0
  - it: should override port, protocol, targetPort and nodePort for the primary http port
    set:
      vtselect:
        service:
          type: NodePort
          portOverrides:
            http:
              port: 9999
              protocol: UDP
              targetPort: custom-target
              nodePort: 31234
    asserts:
      - equal:
          path: spec.ports[0]
          value:
            name: http
            port: 9999
            protocol: UDP
            targetPort: custom-target
            nodePort: 31234
        documentIndex: 1
