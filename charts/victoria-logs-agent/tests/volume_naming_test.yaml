suite: volume naming tests
set:
  remoteWrite[0].url: http://x
  persistentVolume.enabled: true
templates:
  - server.yaml
tests:
  - it: uses the legacy volume name by default
    asserts:
      - equal:
          path: spec.volumeClaimTemplates[0].metadata.name
          value: vl-agent-data
      - exists:
          path: spec.template.spec.containers[0].volumeMounts[?(@.name == "vl-agent-data")]

  - it: "uses the operator volume name with useLegacyNaming: false"
    set:
      useLegacyNaming: false
    asserts:
      - equal:
          path: spec.volumeClaimTemplates[0].metadata.name
          value: tmp-data
      - exists:
          path: spec.template.spec.containers[0].volumeMounts[?(@.name == "tmp-data")]
