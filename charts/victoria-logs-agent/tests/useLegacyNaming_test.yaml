suite: useLegacyNaming tests
set:
  service.enabled: true
  remoteWrite[0].url: http://x
templates:
  - server.yaml
  - service.yaml
tests:
  - it: "resource names (legacy naming, default)"
    asserts:
      - equal:
          path: metadata.name
          value: RELEASE-NAME-victoria-logs-agent
        documentSelector:
          path: metadata.name
          value: RELEASE-NAME-victoria-logs-agent
        template: server.yaml
      - equal:
          path: metadata.name
          value: RELEASE-NAME-victoria-logs-agent
        documentSelector:
          path: metadata.name
          value: RELEASE-NAME-victoria-logs-agent
        template: service.yaml
  - it: "resource names, useLegacyNaming=false (currently a no-op on this chart -- server.yaml uses vm.fullname directly, not useLegacyNaming-aware; service.yaml's vm.plain.fullname has no appKey/kindOverride so it also falls back to the legacy name)"
    set:
      useLegacyNaming: false
    asserts:
      - equal:
          path: metadata.name
          value: RELEASE-NAME-victoria-logs-agent
        documentSelector:
          path: metadata.name
          value: RELEASE-NAME-victoria-logs-agent
        template: server.yaml
      - equal:
          path: metadata.name
          value: RELEASE-NAME-victoria-logs-agent
        documentSelector:
          path: metadata.name
          value: RELEASE-NAME-victoria-logs-agent
        template: service.yaml
