suite: useLegacyNaming tests
set:
  service.enabled: true
  remoteWrite[0].url: http://x
templates:
  - server.yaml
  - service.yaml
tests:
  - it: "resource names (legacy naming, default)"
    asserts:
      - equal:
          path: metadata.name
          value: RELEASE-NAME-victoria-logs-agent
        documentSelector:
          path: metadata.name
          value: RELEASE-NAME-victoria-logs-agent
        template: server.yaml
      - equal:
          path: metadata.name
          value: RELEASE-NAME-victoria-logs-agent
        documentSelector:
          path: metadata.name
          value: RELEASE-NAME-victoria-logs-agent
        template: service.yaml
  - it: "resource names, useLegacyNaming=false"
    set:
      useLegacyNaming: false
    asserts:
      - equal:
          path: metadata.name
          value: vlagent-RELEASE-NAME
        documentSelector:
          path: metadata.name
          value: vlagent-RELEASE-NAME
        template: server.yaml
      - equal:
          path: metadata.name
          value: vlagent-RELEASE-NAME
        documentSelector:
          path: metadata.name
          value: vlagent-RELEASE-NAME
        template: service.yaml
