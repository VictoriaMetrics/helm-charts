suite: useLegacyNaming tests
capabilities:
  apiVersions:
    - autoscaling.k8s.io/v1
set:
  verticalPodAutoscaler.enabled: true
  service.enabled: true
  serviceMonitor.enabled: true
  horizontalPodAutoscaler.enabled: true
  horizontalPodAutoscaler.maxReplicas: 3
  networkPolicy.enabled: true
  remoteWrite[0].url: http://x
templates:
  - hpa.yaml
  - monitor.yaml
  - networkpolicy.yaml
  - server.yaml
  - service.yaml
  - vpa.yaml
tests:
  - it: "resource names (legacy naming, default)"
    asserts:
      - equal:
          path: metadata.name
          value: RELEASE-NAME-victoria-logs-agent
        template: server.yaml
      - equal:
          path: metadata.name
          value: RELEASE-NAME-victoria-logs-agent
        template: service.yaml
      - equal:
          path: metadata.name
          value: RELEASE-NAME-victoria-logs-agent
        template: hpa.yaml
      - equal:
          path: metadata.name
          value: RELEASE-NAME-victoria-logs-agent
        template: monitor.yaml
      - equal:
          path: metadata.name
          value: RELEASE-NAME-victoria-logs-agent
        template: networkpolicy.yaml
      - equal:
          path: spec.serviceName
          value: RELEASE-NAME-victoria-logs-agent
        template: server.yaml
      - equal:
          path: spec.scaleTargetRef.name
          value: RELEASE-NAME-victoria-logs-agent
        template: hpa.yaml
      - equal:
          path: metadata.name
          value: RELEASE-NAME-victoria-logs-agent
        template: vpa.yaml
      - equal:
          path: spec.targetRef.name
          value: RELEASE-NAME-victoria-logs-agent
        template: vpa.yaml
  - it: "resource names, useLegacyNaming=false"
    set:
      useLegacyNaming: false
    asserts:
      - equal:
          path: metadata.name
          value: vlagent-RELEASE-NAME
        template: server.yaml
      - equal:
          path: metadata.name
          value: vlagent-RELEASE-NAME
        template: service.yaml
      - equal:
          path: metadata.name
          value: vlagent-RELEASE-NAME
        template: hpa.yaml
      - equal:
          path: metadata.name
          value: vlagent-RELEASE-NAME
        template: monitor.yaml
      - equal:
          path: metadata.name
          value: vlagent-RELEASE-NAME
        template: networkpolicy.yaml
      - equal:
          path: spec.serviceName
          value: vlagent-RELEASE-NAME
        template: server.yaml
      - equal:
          path: spec.scaleTargetRef.name
          value: vlagent-RELEASE-NAME
        template: hpa.yaml
      - equal:
          path: metadata.name
          value: vlagent-RELEASE-NAME
        template: vpa.yaml
      - equal:
          path: spec.targetRef.name
          value: vlagent-RELEASE-NAME
        template: vpa.yaml
