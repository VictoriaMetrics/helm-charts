apiVersion: apps/v1
kind: Deployment
metadata:
  name: release-name-vmestimator-select
  namespace: infra
  labels: 
    app.kubernetes.io/component: select
    app.kubernetes.io/instance: release-name
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: vmestimator
    app.kubernetes.io/version: v0.1.15
    helm.sh/chart: vmestimator-0.1.0
spec:
  replicas: 2
  selector:
    matchLabels: 
      app: select
      app.kubernetes.io/instance: release-name
      app.kubernetes.io/name: vmestimator
  template:
    metadata:
      labels: 
        app: select
        app.kubernetes.io/component: select
        app.kubernetes.io/instance: release-name
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/name: vmestimator
    spec:
      securityContext: 
        fsGroup: 2000
        runAsNonRoot: true
      containers:
        - name: vmestimator
          securityContext: 
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
          image: docker.io/victoriametrics/vmestimator:v0.1.15
          imagePullPolicy: IfNotPresent
          args: 
            - --envflag.enable
            - --envflag.prefix=VM_
            - --httpListenAddr=:8490
            - --loggerFormat=json
            - --storageNode=http://release-name-vmestimator-storage-0.release-name-vmestimator-storage.infra.svc.cluster.local:8490
            - --storageNode=http://release-name-vmestimator-storage-1.release-name-vmestimator-storage.infra.svc.cluster.local:8490
            - --storageNode=http://release-name-vmestimator-storage-2.release-name-vmestimator-storage.infra.svc.cluster.local:8490
          ports:
            - name: http
              containerPort: 8490
              protocol: TCP
          readinessProbe: 
            httpGet:
              path: /health
              port: http
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe: 
            httpGet:
              path: /health
              port: http
              scheme: HTTP
            initialDelaySeconds: 30
            periodSeconds: 30
