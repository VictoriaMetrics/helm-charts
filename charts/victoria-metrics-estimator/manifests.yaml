apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: release-name-vmestimator-storage
  namespace: infra
  labels: 
    app.kubernetes.io/component: storage
    app.kubernetes.io/instance: release-name
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: vmestimator
    app.kubernetes.io/version: v0.1.15
    helm.sh/chart: vmestimator-0.1.0
spec:
  replicas: 3
  serviceName: release-name-vmestimator-storage
  podManagementPolicy: Parallel
  selector:
    matchLabels: 
      app: storage
      app.kubernetes.io/instance: release-name
      app.kubernetes.io/name: vmestimator
  template:
    metadata:
      annotations:
        checksum/config: 19a572c1ca666be7882c1ceecb9b39d8be6a7ff33385eca21a4c40faee5c0165
      labels: 
        app: storage
        app.kubernetes.io/component: storage
        app.kubernetes.io/instance: release-name
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/name: vmestimator
    spec:
      securityContext: 
        fsGroup: 2000
        runAsNonRoot: true
      containers:
        - name: vmestimator
          securityContext: 
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
          image: docker.io/victoriametrics/vmestimator:v0.1.15
          imagePullPolicy: IfNotPresent
          args: 
            - --cardinalityMetrics.exposeAt=/cardinality/metrics
            - --config=/etc/vmestimator/streams.yaml
            - --envflag.enable
            - --envflag.prefix=VM_
            - --httpListenAddr=:8490
            - --loggerFormat=json
          ports:
            - name: http
              containerPort: 8490
              protocol: TCP
          readinessProbe: 
            httpGet:
              path: /health
              port: http
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe: 
            httpGet:
              path: /health
              port: http
              scheme: HTTP
            initialDelaySeconds: 30
            periodSeconds: 30
          volumeMounts:
            - name: config
              mountPath: /etc/vmestimator
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: release-name-vmestimator
            items:
              - key: streams.yaml
                path: streams.yaml
