suite: Service
templates:
  - service.yaml
tests:
  - it: keeps metadata-only labels out of the pod selector
    set:
      storage.service.labels.owner: networking
    asserts:
      - equal:
          path: metadata.labels.owner
          value: networking
      - equal:
          path: spec.selector
          value:
            app.kubernetes.io/component: monitoring
            app.kubernetes.io/instance: RELEASE-NAME
            app.kubernetes.io/name: vmestimator-storage
            managed-by: vm-operator
  - it: derives the Service port from the listener
    set:
      storage.extraArgs.httpListenAddr: "127.0.0.1:9000"
    asserts:
      - equal:
          path: spec.ports[0].port
          value: 9000
  - it: names Services after their component and honors the component's fullnameOverride
    set:
      select.enabled: true
      select.fullnameOverride: custom-select
      storage.fullnameOverride: custom-storage
    asserts:
      - equal:
          path: metadata.name
          value: custom-storage
        documentIndex: 0
      - equal:
          path: metadata.name
          value: custom-select
        documentIndex: 1

  - it: without select exposes only the headless storage Service
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: vmestimator-storage-RELEASE-NAME
      - equal:
          path: spec.clusterIP
          value: None
      - equal:
          path: spec.publishNotReadyAddresses
          value: true
      - equal:
          path: spec.selector["app.kubernetes.io/name"]
          value: vmestimator-storage

  - it: with select exposes the headless storage Service and the select Service
    set:
      select.enabled: true
      select.service.type: NodePort
    asserts:
      - hasDocuments:
          count: 2
      - equal:
          path: metadata.name
          value: vmestimator-storage-RELEASE-NAME
        documentIndex: 0
      - equal:
          path: spec.clusterIP
          value: None
        documentIndex: 0
      - equal:
          path: spec.selector["app.kubernetes.io/name"]
          value: vmestimator-storage
        documentIndex: 0
      - equal:
          path: metadata.name
          value: vmestimator-select-RELEASE-NAME
        documentIndex: 1
      - equal:
          path: spec.type
          value: NodePort
        documentIndex: 1
      - notExists:
          path: spec.clusterIP
        documentIndex: 1
      - equal:
          path: spec.selector["app.kubernetes.io/name"]
          value: vmestimator-select
        documentIndex: 1
