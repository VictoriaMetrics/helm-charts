suite: useLegacyNaming tests
set:
  mode: cluster
  ingress.enabled: true
  serviceMonitor.enabled: true
  serviceAccount.create: true
  networkPolicy.enabled: true
  storage.podDisruptionBudget.enabled: true
  select.podDisruptionBudget.enabled: true
templates:
  - configmap.yaml
  - ingress.yaml
  - monitor.yaml
  - networkpolicy.yaml
  - pdb.yaml
  - service.yaml
  - serviceaccount.yaml
  - workload.yaml
tests:
  - it: "resource names (useLegacyNaming: false, default)"
    asserts:
      - equal:
          path: metadata.name
          value: vmestimator-RELEASE-NAME
        documentSelector:
          path: metadata.name
          value: vmestimator-RELEASE-NAME
        template: configmap.yaml
      - equal:
          path: metadata.name
          value: vmestimator-select-RELEASE-NAME
        documentSelector:
          path: metadata.name
          value: vmestimator-select-RELEASE-NAME
        template: ingress.yaml
      - equal:
          path: metadata.name
          value: vmestimator-select-RELEASE-NAME
        documentSelector:
          path: metadata.name
          value: vmestimator-select-RELEASE-NAME
        template: monitor.yaml
      - equal:
          path: metadata.name
          value: vmestimator-RELEASE-NAME
        documentSelector:
          path: metadata.name
          value: vmestimator-RELEASE-NAME
        template: networkpolicy.yaml
      - equal:
          path: metadata.name
          value: vmestimator-storage-RELEASE-NAME
        documentSelector:
          path: metadata.name
          value: vmestimator-storage-RELEASE-NAME
        template: pdb.yaml
      - equal:
          path: metadata.name
          value: vmestimator-select-RELEASE-NAME
        documentSelector:
          path: metadata.name
          value: vmestimator-select-RELEASE-NAME
        template: pdb.yaml
      - equal:
          path: metadata.name
          value: vmestimator-storage-RELEASE-NAME
        documentSelector:
          path: metadata.name
          value: vmestimator-storage-RELEASE-NAME
        template: service.yaml
      - equal:
          path: metadata.name
          value: vmestimator-storage-RELEASE-NAME-insert
        documentSelector:
          path: metadata.name
          value: vmestimator-storage-RELEASE-NAME-insert
        template: service.yaml
      - equal:
          path: metadata.name
          value: vmestimator-select-RELEASE-NAME
        documentSelector:
          path: metadata.name
          value: vmestimator-select-RELEASE-NAME
        template: service.yaml
      - equal:
          path: metadata.name
          value: vmestimator-RELEASE-NAME
        documentSelector:
          path: metadata.name
          value: vmestimator-RELEASE-NAME
        template: serviceaccount.yaml
      - equal:
          path: metadata.name
          value: vmestimator-select-RELEASE-NAME
        documentSelector:
          path: metadata.name
          value: vmestimator-select-RELEASE-NAME
        template: workload.yaml
      - equal:
          path: metadata.name
          value: vmestimator-storage-RELEASE-NAME
        documentSelector:
          path: metadata.name
          value: vmestimator-storage-RELEASE-NAME
        template: workload.yaml
  - it: "useLegacyNaming: true is rejected -- this chart only supports operator-style naming"
    set:
      useLegacyNaming: true
    asserts:
      - failedTemplate:
          errorMessage: "useLegacyNaming: true is not supported by the victoria-metrics-estimator chart; it only supports operator-style resource naming"
        template: workload.yaml
