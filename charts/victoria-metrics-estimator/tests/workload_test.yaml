suite: vmestimator workloads
templates:
  - workload.yaml
tests:
  - it: renders single mode
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Deployment
      - contains:
          path: spec.template.spec.containers[0].args
          content: --config=/etc/vmestimator/streams.yaml
      - matchRegex:
          path: spec.template.metadata.annotations["checksum/config"]
          pattern: ^[a-f0-9]{64}$
  - it: single mode inherits storage's cardinalityMetrics.exposeAt default (monitor.yaml scrapes both paths to compensate, see monitor_test.yaml)
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --cardinalityMetrics.exposeAt=/cardinality/metrics
  - it: single mode still honors an explicit deprecated single.extraArgs.cardinalityMetrics.exposeAt
    set:
      single.extraArgs:
        cardinalityMetrics.exposeAt: /custom/path
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --cardinalityMetrics.exposeAt=/custom/path
  - it: omits the checksum for an external ConfigMap
    set:
      config.existingConfigMap: external-config
    asserts:
      - notExists:
          path: spec.template.metadata.annotations["checksum/config"]
      - equal:
          path: spec.template.spec.volumes[0].configMap.name
          value: external-config
  - it: derives the container port from the listener
    set:
      single.extraArgs.httpListenAddr: ":9000"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --httpListenAddr=:9000
      - equal:
          path: spec.template.spec.containers[0].ports[0].containerPort
          value: 9000
  - it: single mode falls back to storage.* when single.* doesn't set a field
    set:
      storage.extraArgs.httpListenAddr: ":9001"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --httpListenAddr=:9001
      - equal:
          path: spec.template.spec.containers[0].ports[0].containerPort
          value: 9001
  - it: single.* takes precedence over storage.* for the same field
    set:
      storage.extraArgs.httpListenAddr: ":9001"
      single.extraArgs.httpListenAddr: ":9002"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --httpListenAddr=:9002
      - equal:
          path: spec.template.spec.containers[0].ports[0].containerPort
          value: 9002
  - it: always runs a single replica in single mode, regardless of storage.replicaCount or single.replicaCount
    set:
      storage.replicaCount: 5
      single.replicaCount: 7
    asserts:
      - equal:
          path: spec.replicas
          value: 1
  - it: renders cluster mode
    set:
      mode: cluster
      storage.replicaCount: 2
      storage.extraArgs.httpListenAddr: ":9001"
    asserts:
      - hasDocuments:
          count: 2
      - isKind:
          of: StatefulSet
        documentIndex: 0
      - isKind:
          of: Deployment
        documentIndex: 1
      - contains:
          path: spec.template.spec.containers[0].args
          content: --storageNode=http://vmestimator-storage-RELEASE-NAME-1.vmestimator-storage-RELEASE-NAME.NAMESPACE.svc.cluster.local:9001
        documentIndex: 1
  - it: preserves component fullname overrides
    set:
      single.fullnameOverride: custom-single
    asserts:
      - equal:
          path: metadata.name
          value: custom-single

  - it: component fullname override wins over the chart-level fullnameOverride
    set:
      fullnameOverride: shared
      single.fullnameOverride: custom-single
    asserts:
      - equal:
          path: metadata.name
          value: custom-single
