{{- if .Values.networkPolicy.enabled }}
{{- $root := . }}
{{- $components := ternary (list "single") (list "storage" "select") (eq .Values.mode "single") }}
{{- range $component := $components }}
{{- $ctx := dict "helm" $root "appKey" $component "kindOverride" (include "vmestimator.kind" $component) }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "vmestimator.fullname" (dict "root" $root "component" $component) }}
  namespace: {{ include "vm.namespace" $ctx }}
  {{- $_ := set $ctx "extraLabels" (deepCopy $root.Values.networkPolicy.labels) }}
  labels: {{ include "vm.labels" $ctx | nindent 4 }}
  {{- $_ := unset $ctx "extraLabels" }}
  {{- with $root.Values.networkPolicy.annotations }}
  annotations: {{ toYaml . | nindent 4 }}
  {{- end }}
spec:
  podSelector:
    matchLabels: {{ include "vm.selectorLabels" $ctx | nindent 6 }}
  {{- with $root.Values.networkPolicy.ingress }}
  ingress: {{ toYaml . | nindent 4 }}
  {{- end }}
  {{- with $root.Values.networkPolicy.egress }}
  egress: {{ toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- end }}
