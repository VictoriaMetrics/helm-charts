suite: useLegacyNaming tests
set:
  server.ingress.enabled: true
  server.route.enabled: true
  server.service.enabled: true
  server.persistentVolume.enabled: true
  server.serviceMonitor.enabled: true
  podDisruptionBudget.enabled: true
  networkPolicy.enabled: true
  serviceAccount.create: true
  server.mode: deployment
templates:
  - ingress.yaml
  - monitor.yaml
  - networkpolicy.yaml
  - pdb.yaml
  - pvc.yaml
  - route.yaml
  - server.yaml
  - service.yaml
  - serviceaccount.yaml
tests:
  - it: "resource names (legacy naming, default)"
    asserts:
      - equal:
          path: metadata.name
          value: RELEASE-NAME-vt-single-server
        documentSelector:
          path: metadata.name
          value: RELEASE-NAME-vt-single-server
        template: ingress.yaml
      - equal:
          path: metadata.name
          value: RELEASE-NAME-vt-single-server
        documentSelector:
          path: metadata.name
          value: RELEASE-NAME-vt-single-server
        template: monitor.yaml
      - equal:
          path: metadata.name
          value: RELEASE-NAME-vt-single-server
        documentSelector:
          path: metadata.name
          value: RELEASE-NAME-vt-single-server
        template: networkpolicy.yaml
      - equal:
          path: metadata.name
          value: RELEASE-NAME-vt-single-server
        documentSelector:
          path: metadata.name
          value: RELEASE-NAME-vt-single-server
        template: pdb.yaml
      - equal:
          path: metadata.name
          value: RELEASE-NAME-vt-single-server
        documentSelector:
          path: metadata.name
          value: RELEASE-NAME-vt-single-server
        template: pvc.yaml
      - equal:
          path: metadata.name
          value: RELEASE-NAME-vt-single-server
        documentSelector:
          path: metadata.name
          value: RELEASE-NAME-vt-single-server
        template: route.yaml
      - equal:
          path: metadata.name
          value: RELEASE-NAME-vt-single-server
        documentSelector:
          path: metadata.name
          value: RELEASE-NAME-vt-single-server
        template: server.yaml
      - equal:
          path: metadata.name
          value: RELEASE-NAME-vt-single-server
        documentSelector:
          path: metadata.name
          value: RELEASE-NAME-vt-single-server
        template: service.yaml
      - equal:
          path: metadata.name
          value: RELEASE-NAME-vt-single-server
        documentSelector:
          path: metadata.name
          value: RELEASE-NAME-vt-single-server
        template: serviceaccount.yaml
  - it: "resource names (useLegacyNaming: false)"
    set:
      useLegacyNaming: false
    asserts:
      - equal:
          path: metadata.name
          value: vtsingle-RELEASE-NAME
        documentSelector:
          path: metadata.name
          value: vtsingle-RELEASE-NAME
        template: ingress.yaml
      - equal:
          path: metadata.name
          value: vtsingle-RELEASE-NAME
        documentSelector:
          path: metadata.name
          value: vtsingle-RELEASE-NAME
        template: monitor.yaml
      - equal:
          path: metadata.name
          value: vtsingle-RELEASE-NAME
        documentSelector:
          path: metadata.name
          value: vtsingle-RELEASE-NAME
        template: networkpolicy.yaml
      - equal:
          path: metadata.name
          value: vtsingle-RELEASE-NAME
        documentSelector:
          path: metadata.name
          value: vtsingle-RELEASE-NAME
        template: pdb.yaml
      - equal:
          path: metadata.name
          value: vtsingle-RELEASE-NAME
        documentSelector:
          path: metadata.name
          value: vtsingle-RELEASE-NAME
        template: pvc.yaml
      - equal:
          path: metadata.name
          value: vtsingle-RELEASE-NAME
        documentSelector:
          path: metadata.name
          value: vtsingle-RELEASE-NAME
        template: route.yaml
      - equal:
          path: metadata.name
          value: vtsingle-RELEASE-NAME
        documentSelector:
          path: metadata.name
          value: vtsingle-RELEASE-NAME
        template: server.yaml
      - equal:
          path: metadata.name
          value: vtsingle-RELEASE-NAME
        documentSelector:
          path: metadata.name
          value: vtsingle-RELEASE-NAME
        template: service.yaml
      - equal:
          path: metadata.name
          value: vtsingle-RELEASE-NAME
        documentSelector:
          path: metadata.name
          value: vtsingle-RELEASE-NAME
        template: serviceaccount.yaml
